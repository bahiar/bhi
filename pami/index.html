<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Bahía Blanca - Médicos, Salas y Sociedades de Fomento</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --primary: #F4FF2B;
    --secondary: #0F191E;
    --surface: #E2F1F2;
    --mc: #1E88E5;
    --us: #E53935;
    --sf: #43A047;
    --cj: #8E24AA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--secondary); }

  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    background: var(--secondary);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--primary);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .stats { font-size: 12px; opacity: .75; }

  #controls {
    background: var(--surface);
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #cfdde0;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #fff;
    border: 1.5px solid #d7e0e1;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    user-select: none;
    transition: all .15s ease;
  }
  .chip.active { border-color: currentColor; background: #fff; box-shadow: 0 0 0 1px currentColor inset; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chip[data-tipo="MC"] { color: var(--mc); }
  .chip[data-tipo="US"] { color: var(--us); }
  .chip[data-tipo="SF"] { color: var(--sf); }
  .chip[data-tipo="CJ"] { color: var(--cj); }
  .chip .dot { background: currentColor; }

  #search {
    margin-left: auto;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1.5px solid #d7e0e1;
    font-size: 13px;
    min-width: 200px;
    outline: none;
  }
  #search:focus { border-color: var(--secondary); }

  #map { position: absolute; inset: 0; height: 100%; width: 100%; }

  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .popup-tipo {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    margin-bottom: 6px;
  }
  .popup-nombre { font-weight: 700; font-size: 14px; margin: 0 0 2px; color: var(--secondary); }
  .popup-dom { font-size: 12px; color: #555; }
  .popup-capita { font-size: 12px; color: #333; font-weight: 600; margin: 4px 0 0; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--secondary); color: var(--primary); font-size: 14px; z-index: 9999;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📍 Mapa de Bahía Blanca</h1>
    <div class="stats" id="stats">Cargando datos…</div>
  </header>
  <div id="controls">
    <div class="chip active" data-tipo="MC"><span class="dot"></span>Médicos de Cabecera</div>
    <div class="chip active" data-tipo="US"><span class="dot"></span>Salas Médicas</div>
    <div class="chip active" data-tipo="SF"><span class="dot"></span>Sociedades de Fomento</div>
    <div class="chip active" data-tipo="CJ"><span class="dot"></span>Centros de Jubilados</div>
    <input id="search" type="text" placeholder="Buscar por nombre o dirección…" />
  </div>
  <div style="position:relative; flex:1;">
    <div id="loading">Cargando ubicaciones…</div>
    <div id="map"></div>
  </div>
</div>

<script>
const COLORS = { MC: '#1E88E5', US: '#E53935', SF: '#43A047', CJ: '#8E24AA' };
const JSON_URL = 'ubicaciones.json'; // mismo repo. Si lo servís desde otro repo, poné la URL raw de GitHub acá.

const map = L.map('map', { zoomControl: true }).setView([-38.7196, -62.2724], 12);
setTimeout(() => map.invalidateSize(), 100);
window.addEventListener('resize', () => map.invalidateSize());

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const layers = { MC: L.layerGroup(), US: L.layerGroup(), SF: L.layerGroup(), CJ: L.layerGroup() };
Object.values(layers).forEach(l => l.addTo(map));

let allItems = [];

function makeIcon(tipo) {
  const color = COLORS[tipo];
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -8]
  });
}

function popupHTML(item, labelMap) {
  const color = COLORS[item.tipo];
  const capita = item.distrib
    ? `<p class="popup-capita">Cápita: ${item.distrib} afiliados</p>`
    : '';
  return `
    <span class="popup-tipo" style="background:${color}">${labelMap[item.tipo] || item.tipo}</span>
    <p class="popup-nombre">${item.nombre}</p>
    <p class="popup-dom">${item.domicilio || ''}</p>
    ${capita}
  `;
}

fetch(JSON_URL)
  .then(r => r.json())
  .then(data => {
    allItems = data.ubicaciones;
    const labelMap = data.metadata.tipo_labels || {};
    document.getElementById('loading').style.display = 'none';
    document.getElementById('stats').textContent =
      `${data.metadata.total} ubicaciones · ${data.metadata.tipos.map(t => `${t}: ${allItems.filter(i=>i.tipo===t).length}`).join(' · ')}`;

    allItems.forEach(item => {
      let layer;
      if (item.poligono && item.poligono.length > 2) {
        layer = L.polygon(item.poligono, {
          color: COLORS[item.tipo],
          weight: 2,
          fillOpacity: 0.15
        });
      } else if (item.lat && item.lon) {
        layer = L.marker([item.lat, item.lon], { icon: makeIcon(item.tipo) });
      } else {
        return;
      }
      layer.bindPopup(popupHTML(item, labelMap));
      layer._itemRef = item;
      layers[item.tipo].addLayer(layer);
    });
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Error cargando ubicaciones.json: ' + err.message;
  });

// Toggle de capas por tipo
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const tipo = chip.dataset.tipo;
    chip.classList.toggle('active');
    if (chip.classList.contains('active')) {
      map.addLayer(layers[tipo]);
    } else {
      map.removeLayer(layers[tipo]);
    }
  });
});

// Búsqueda simple
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  Object.entries(layers).forEach(([tipo, group]) => {
    group.eachLayer(layer => {
      const item = layer._itemRef;
      const match = !q || item.nombre.toLowerCase().includes(q) || (item.domicilio || '').toLowerCase().includes(q);
      const chipActive = document.querySelector(`.chip[data-tipo="${tipo}"]`).classList.contains('active');
      const el = layer.getElement ? layer.getElement() : null;
      if (layer.setStyle) {
        layer.setStyle({ opacity: match ? 1 : 0, fillOpacity: match ? 0.15 : 0 });
      }
      if (el) el.style.display = match ? '' : 'none';
    });
  });
});
</script>
</body>
</html>
