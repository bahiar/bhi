  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function initContactForm() {
      // Credenciales reales de tu cuenta EmailJS
      var EMAILJS_PUBLIC_KEY = 'tNzeWvJIYif8LJDKb';
      var EMAILJS_SERVICE_ID = 'service_8yz5lo8';
      var EMAILJS_TEMPLATE_ID = 'template_ozra74t';

      var form = document.getElementById('form-contacto');
      var status = document.getElementById('c-status');
      var submitBtn = document.getElementById('c-submit');

      if (!form) return;

      document.addEventListener('DOMContentLoaded', function () {
        if (typeof emailjs === 'undefined') {
          console.warn('[BAHI.ar] EmailJS no se pudo cargar.');
          return;
        }
        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        status.textContent = '';
        status.className = '';

        // Honeypot: si un bot completó este campo oculto, se descarta silenciosamente
        if (form.empresa.value.trim() !== '') {
          form.reset();
          return;
        }

        var nombre = form.nombre.value.trim();
        var email = form.email.value.trim();
        var mensaje = form.mensaje.value.trim();

        if (!nombre || !email || !mensaje) {
          status.textContent = 'Completá todos los campos.';
          status.className = 'error';
          return;
        }

        if (typeof emailjs === 'undefined') {
          status.textContent = 'No se pudo cargar el servicio de envío. Probá de nuevo más tarde.';
          status.className = 'error';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';

        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          nombre: nombre,
          email: email,
          mensaje: mensaje
        }).then(function () {
          status.textContent = '¡Mensaje enviado! Te responderemos pronto.';
          status.className = 'ok';
          form.reset();
        }).catch(function (err) {
          console.error('[BAHI.ar] Error EmailJS:', err);
          status.textContent = 'No se pudo enviar. Probá de nuevo o escribinos por WhatsApp.';
          status.className = 'error';
        }).finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar mensaje';
        });
      });
    })();
  </script>
