<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Laboratorios</title>
    
    <meta name="description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/laboratorios.html">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta property="og:title" content="BAHI.ar | Laboratorios">
    <meta property="og:description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/laboratorios.html">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      .filter-chips-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px 12px 16px;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        border-radius: 16px;
        border: 1.5px solid var(--accent, #4f46e5);
        background: transparent;
        color: var(--accent, #4f46e5);
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
      }
      .filter-chip.active {
        background: var(--accent, #4f46e5);
        color: #fff;
      }
      .filter-chip-select {
        border: 1.5px solid var(--accent, #4f46e5);
        border-radius: 16px;
        padding: 5px 10px;
        font-size: 13px;
        background: transparent;
        color: var(--accent, #4f46e5);
        cursor: pointer;
        outline: none;
        transition: background 0.15s, color 0.15s;
      }
      .filter-chip-select.active {
        background: var(--accent, #4f46e5);
        color: #fff;
      }
      .filter-chip-select option {
        background: #fff;
        color: #191971;
      }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>
    </header>

    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" id="buscador-live" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <nav class="sub-nav" aria-label="Accesos rápidos">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link">Turnos</a></li>
            <li><a href="guardias.html" class="sub-nav-link">Guardias</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link active">Laboratorios</a></li>
        </ul>
    </nav>

    <div class="filter-chips-container" id="filter-chips-container">
      <select class="filter-chip-select" id="chip-localidad" aria-label="Filtrar por localidad">
        <option value="">Todas las localidades</option>
      </select>
      <button class="filter-chip" id="chip-stock" data-field="STOCK" aria-pressed="false">Stock</button>
      <button class="filter-chip" id="chip-inyectables" data-field="INYECTABLES" aria-pressed="false">Inyectables</button>
      <button class="filter-chip" id="chip-delivery" data-field="DELIVERY" aria-pressed="false">Delivery</button>
      <select class="filter-chip-select" id="chip-ooss" aria-label="Filtrar por Obra Social">
        <option value="">Todas las OOSS</option>
      </select>
    </div>

    <main class="app-view" id="content">
        <div id="main-content">
            <div style="padding: 16px;">
                <h2>Laboratorios</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                    Análisis clínicos y bioquímicos en la ciudad.
                </p>
            </div>

            <div id="contenedor-cards"></div>
            
        </div>
    </main>

    <div id="nav-placeholder"></div>
    <script src="app.js" defer></script>
    <script defer>
      (function() {
        const TIPO_VISTA = 'LABORATORIO';
        const CONTENEDOR_ID = 'contenedor-cards';
        let datosOriginales = [];
        const filtros = { texto: '', localidad: '', stock: false, inyectables: false, delivery: false, ooss: '' };

        function renderCards(lista) {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          if (!contenedor) return;
          contenedor.innerHTML = '';
          if (lista.length === 0) {
            contenedor.innerHTML = '<p style="padding: 16px;">No hay resultados para los filtros aplicados.</p>';
            return;
          }
          
          const fragments = lista.map((item, index) => {
            const bodyId = `card-body-${TIPO_VISTA}-${index}`;
            const linkTel = item.FIJO ? (item.FIJO.toLowerCase().startsWith('tel:') ? item.FIJO : 'tel:' + item.FIJO) : '';
            const linkMovil = item.MOVIL ? (item.MOVIL.toLowerCase().startsWith('https://') || item.MOVIL.toLowerCase().startsWith('tel:') ? item.MOVIL : 'tel:' + item.MOVIL) : '';
            const telDisplay = item.FIJO ? item.FIJO.replace(/^tel:/i, '') : '';
            const mapsUrl = window.safeMapsUrl ? window.safeMapsUrl(item.MAPS) : item.MAPS;

            return `
<div class="card">
  <button class="card-header" aria-expanded="false" aria-controls="${bodyId}">
    <span>${window.esc(item.PRESTADOR)}</span>
    <span aria-hidden="true">▼</span>
  </button>
  <div class="card-body-collapse" id="${bodyId}">
    ${item.DOMICILIO ? `<p style="margin-bottom: 10px;"><strong>Dirección:</strong> ${window.esc(item.DOMICILIO)}</p>` : ''}
    ${item.LOCALIDAD ? `<p style="margin-bottom: 10px;"><strong>Localidad:</strong> ${window.esc(item.LOCALIDAD)}</p>` : ''}
    ${item.NIVEL ? `<p style="margin-bottom: 10px;"><strong>Nivel:</strong> ${window.esc(item.NIVEL)}</p>` : ''}
    ${item.HORARIO ? `<p style="margin-bottom: 10px;"><strong>Horario:</strong> ${window.esc(item.HORARIO)}</p>` : ''}
    ${item.STOCK ? `<p style="margin-bottom: 10px;"><strong>Stock:</strong> ${window.esc(item.STOCK)}</p>` : ''}
    <p style="margin-bottom: 10px;"><strong>Inyectables:</strong> ${item.INYECTABLES ? 'Sí' : 'No'}</p>
    <p style="margin-bottom: 10px;"><strong>Delivery:</strong> ${item.DELIVERY ? 'Sí' : 'No'}</p>
    ${item.OOSS ? `<p style="margin-bottom: 10px;"><strong>OOSS:</strong> ${window.esc(item.OOSS)}</p>` : ''}
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
      ${linkTel ? `<a href="${window.esc(linkTel)}" class="btn btn-accent" aria-label="Llamar a ${window.esc(item.PRESTADOR)}, ${window.esc(telDisplay)}">Llamar</a>` : ''}
      ${linkMovil ? `<a href="${window.esc(linkMovil)}" class="btn btn-accent" aria-label="WhatsApp de ${window.esc(item.PRESTADOR)}">WhatsApp</a>` : ''}
      ${mapsUrl ? `<a href="${window.esc(mapsUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="Ver ${window.esc(item.PRESTADOR)} en Google Maps">Mapa</a>` : ''}
    </div>
  </div>
</div>`;
          });
          contenedor.innerHTML = fragments.join('');
        }

        function aplicarFiltros() {
          const texto = filtros.texto.toLowerCase();
          const resultado = datosOriginales.filter(item => {
            if (texto && !((item.PRESTADOR || '').toLowerCase().includes(texto) || (item.DOMICILIO || '').toLowerCase().includes(texto))) return false;
            if (filtros.localidad && item.LOCALIDAD !== filtros.localidad) return false;
            if (filtros.stock && !item.STOCK) return false;
            if (filtros.inyectables && !item.INYECTABLES) return false;
            if (filtros.delivery && !item.DELIVERY) return false;
            if (filtros.ooss && !(item.OOSS || '').toLowerCase().includes(filtros.ooss.toLowerCase())) return false;
            return true;
          });
          renderCards(resultado);
        }

        async function inicializar() {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          if (!contenedor) return;
          contenedor.innerHTML = '<div style="padding: 16px; color: var(--text-muted);">Cargando datos...</div>';
          
          try {
            const response = await fetch('data/bd_bahiar.json');
            const data = await response.json();
            datosOriginales = data.prestadores.filter(p => p.TIPO === TIPO_VISTA);

            // Poblar Selects
            const selLoc = document.getElementById('chip-localidad');
            if (selLoc) {
              const localidades = [...new Set(datosOriginales.map(p => p.LOCALIDAD).filter(Boolean))].sort();
              localidades.forEach(l => {
                const o = document.createElement('option'); o.value = l; o.textContent = l; selLoc.appendChild(o);
              });
            }

            const selOoss = document.getElementById('chip-ooss');
            if (selOoss) {
              const oossSet = new Set();
              datosOriginales.forEach(p => (p.OOSS || '').split(',').forEach(o => { const t = o.trim(); if(t) oossSet.add(t); }));
              [...oossSet].sort().forEach(o => {
                const opt = document.createElement('option'); opt.value = o; opt.textContent = o; selOoss.appendChild(opt);
              });
            }

            // Eventos
            const buscador = document.getElementById('buscador-live');
            if (buscador) {
              buscador.addEventListener('input', (e) => {
                e.stopImmediatePropagation();
                filtros.texto = e.target.value;
                aplicarFiltros();
              });
            }

            ['chip-stock', 'chip-inyectables', 'chip-delivery'].forEach(id => {
              const btn = document.getElementById(id);
              if (btn) {
                btn.addEventListener('click', () => {
                  const field = btn.getAttribute('data-field').toLowerCase();
                  filtros[field] = !filtros[field];
                  btn.classList.toggle('active', filtros[field]);
                  btn.setAttribute('aria-pressed', filtros[field]);
                  aplicarFiltros();
                });
              }
            });

            if (selLoc) {
              selLoc.addEventListener('change', (e) => {
                filtros.localidad = e.target.value;
                selLoc.classList.toggle('active', !!e.target.value);
                aplicarFiltros();
              });
            }

            if (selOoss) {
              selOoss.addEventListener('change', (e) => {
                filtros.ooss = e.target.value;
                selOoss.classList.toggle('active', !!e.target.value);
                aplicarFiltros();
              });
            }

            renderCards(datosOriginales);
          } catch (e) {
            console.error(e);
            contenedor.innerHTML = '<p style="padding: 16px; color: red;">Error al cargar la base de datos.</p>';
          }
        }

        // Bloqueo total de funciones conflictivas de app.js
        window.renderizarDatos = function() {};
        window.configurarBuscador = function() {};
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => setTimeout(inicializar, 50));
        } else {
          setTimeout(inicializar, 50);
        }
      })();
    </script>
</body>
</html>
