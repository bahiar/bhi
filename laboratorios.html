<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Laboratorios</title>
    
    <!-- Meta SEO para indexación -->
    <meta name="description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/laboratorios.html">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="BAHI.ar | Laboratorios">
    <meta property="og:description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/laboratorios.html">
    <meta property="og:type" content="website">

    <!-- Metadatos PWA -->
    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- Header único -->
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>
    </header>

    <!-- Buscador Global -->
    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <!-- Contenido Principal -->
    <main class="app-view" id="content">
        <div id="main-content">
            <div style="padding: 16px;">
                <h2>Laboratorios</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                    Análisis clínicos y bioquímicos en la ciudad.
                </p>
            </div>

            <!-- AQUÍ SE CARGARÁN LOS DATOS AUTOMÁTICAMENTE -->
            <div id="contenedor-cards"></div>
            
        </div>
    </main>

    <!-- Navegación -->
    <div id="nav-placeholder"></div>
    <script src="app.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
            navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
        }
    </script>
    <script defer>
      function renderizarDatos(tipo, contenedorId) {
        const contenedor = document.getElementById(contenedorId);
        if (!contenedor) return;

        const renderCards = (lista) => {
          contenedor.innerHTML = '';
          if (lista.length === 0) {
            contenedor.innerHTML = '<p style="padding: 16px;">No hay datos disponibles.</p>';
            return;
          }
          lista.forEach((item, index) => {
            const bodyId = `card-body-${tipo}-${index}`;
            let linkTel = item.FIJO ? item.FIJO : '';
            if (linkTel && !linkTel.startsWith('tel:')) {
              linkTel = 'tel:' + linkTel;
            }
            let linkMov = item.MOVIL ? item.MOVIL : '';
            if (linkMov && !linkMov.startsWith('tel:')) {
              linkMov = 'tel:' + linkMov;
            }
            const card = `
<div class="card">
  <button class="card-header" aria-expanded="false" aria-controls="${bodyId}">
    <span>${item.PRESTADOR || ''}</span>
    <span aria-hidden="true">▼</span>
  </button>
  <div class="card-body-collapse" id="${bodyId}">
    ${item.DOMICILIO ? `<p style="margin-bottom: 10px;"><strong>Dirección:</strong> ${item.DOMICILIO}</p>` : ''}
    ${item.LOCALIDAD ? `<p style="margin-bottom: 10px;"><strong>Localidad:</strong> ${item.LOCALIDAD}</p>` : ''}
    ${item.NIVEL ? `<p style="margin-bottom: 10px;"><strong>Nivel:</strong> ${item.NIVEL}</p>` : ''}
    ${item.ESTANDART ? `<p style="margin-bottom: 10px;"><strong>Estándar:</strong> ${item.ESTANDART}</p>` : ''}
    ${item.HORARIO ? `<p style="margin-bottom: 10px;"><strong>Horario:</strong> ${item.HORARIO}</p>` : ''}
    ${item.STOCK ? `<p style="margin-bottom: 10px;"><strong>Stock:</strong> ${item.STOCK}</p>` : ''}
    ${item.INYECTABLES ? `<p style="margin-bottom: 10px;"><strong>Inyectables:</strong> ${item.INYECTABLES}</p>` : ''}
    ${item.DELIVERY ? `<p style="margin-bottom: 10px;"><strong>Delivery:</strong> ${item.DELIVERY}</p>` : ''}
    ${item.OOSS ? `<p style="margin-bottom: 10px;"><strong>OOSS:</strong> ${item.OOSS}</p>` : ''}
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      ${item.FIJO ? `<a href="${linkTel}" class="btn btn-accent" aria-label="Llamar a ${item.PRESTADOR}, ${item.FIJO}">Llamar (${item.FIJO})</a>` : ''}
      ${item.MOVIL ? `<a href="${linkMov}" class="btn btn-accent" aria-label="Llamar al móvil de ${item.PRESTADOR}, ${item.MOVIL}">Móvil (${item.MOVIL})</a>` : ''}
      ${item.MAPS ? `<a href="${item.MAPS}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="Ver ${item.PRESTADOR} en Google Maps">Mapa</a>` : ''}
    </div>
  </div>
</div>`;
            contenedor.innerHTML += card;
          });
        };

        contenedor.innerHTML = '<div style="padding: 16px; color: var(--text-muted);">Cargando...</div>';
        fetch('data/bd_bahiar.json')
          .then(response => response.json())
          .then(data => {
            const filtrados = data.prestadores.filter(p => p.TIPO === tipo);
            renderCards(filtrados);
          })
          .catch(error => {
            console.error('Error:', error);
            contenedor.innerHTML = '<p style="padding: 16px; color: red;">Error al cargar datos.</p>';
          });
      }

      document.addEventListener('DOMContentLoaded', () => renderizarDatos('LABORATORIO', 'contenedor-cards'));
    </script>
</body>
</html>
