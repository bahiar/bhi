    <div class="section-header">

    <div class="filter-chips-container" id="filter-chips-container" role="group" aria-label="Filtros de búsqueda">
        <select class="filter-chip-select" id="chip-localidad" aria-label="Filtrar por zona">
            <option value="">Zona</option>
        </select>
        <button class="filter-chip" id="chip-inyectables" data-field="inyectables" aria-pressed="false">Inyectables</button>
        <button class="filter-chip" id="chip-delivery"    data-field="delivery"    aria-pressed="false">Con envío</button>
        <select class="filter-chip-select" id="chip-ooss" aria-label="Filtrar por Obra Social">
            <option value="">Obras sociales</option>
        </select>
    </div>

    <main class="app-view" id="content">
        <div id="main-content">

            <div id="contenedor-cards" class="cards-grid" aria-live="polite" aria-label="Listado de laboratorios">
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js" defer></script>
    <script defer>
      /**
       * Módulo de Laboratorios — lógica de filtros y renderizado.
       *
       * Usa window.crearCardHTML (definido en app.js) para generar cards
       * con el design system unificado. El accordion y el SW ya están
       * gestionados globalmente por app.js.
       */
      (function () {
        'use strict';

        const TIPO_VISTA    = 'LABORATORIO';
        const CONTENEDOR_ID = 'contenedor-cards';

        let datosOriginales = [];
        const filtros = {
          texto:       '',
          localidad:   '',
          inyectables: false,
          delivery:    false,
          ooss:        ''
        };

        // ── Renderizado ────────────────────────────────────────────────────────

        function renderCards(lista) {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          if (!contenedor) return;

          const metaCount = document.getElementById('header-meta-count');

          if (lista.length === 0) {
            contenedor.innerHTML = `
              <div class="error-state" role="status">
                <div class="error-state-icon" aria-hidden="true">🔍</div>
                <p class="error-state-title">Sin resultados</p>
                <p class="error-state-desc">No hay laboratorios para los filtros aplicados.</p>
              </div>`;
            if (metaCount) metaCount.textContent = 'Sin resultados';
            return;
          }

          contenedor.innerHTML = lista
            .map((item, i) => window.crearCardHTML(item, TIPO_VISTA, i))
            .join('');

          if (metaCount) {
            metaCount.textContent = `${lista.length} laboratorio${lista.length !== 1 ? 's' : ''}`;
          }
        }

        // ── Filtrado ───────────────────────────────────────────────────────────

        function aplicarFiltros() {
          const texto = filtros.texto.toLowerCase();
          const resultado = datosOriginales.filter(item => {
            if (texto && !(
              (item.PRESTADOR || '').toLowerCase().includes(texto) ||
              (item.DOMICILIO  || '').toLowerCase().includes(texto)
            )) return false;
            if (filtros.localidad   && item.LOCALIDAD !== filtros.localidad) return false;
            if (filtros.inyectables && !item.INYECTABLES) return false;
            if (filtros.delivery    && !item.DELIVERY)    return false;
            if (filtros.ooss && !(item.OOSS || '').toLowerCase().includes(filtros.ooss.toLowerCase())) return false;
            return true;
          });
          renderCards(resultado);
        }

        // ── Inicialización ─────────────────────────────────────────────────────

        async function inicializar() {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          if (!contenedor) return;

          try {
            const response = await fetch('data/bd_bahiar.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            datosOriginales = data.prestadores.filter(p => p.TIPO === TIPO_VISTA);

            // Poblar select de localidades
            const selLoc = document.getElementById('chip-localidad');
            if (selLoc) {
              const localidades = [...new Set(
                datosOriginales.map(p => p.LOCALIDAD).filter(Boolean)
              )].sort();
              localidades.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = l;
                selLoc.appendChild(opt);
              });
            }

            // Poblar select de obras sociales
            const selOoss = document.getElementById('chip-ooss');
            if (selOoss) {
              const oossSet = new Set();
              datosOriginales.forEach(p =>
                (p.OOSS || '').split(',').forEach(o => {
                  const t = o.trim();
                  if (t) oossSet.add(t);
                })
              );
              [...oossSet].sort().forEach(o => {
                const opt = document.createElement('option');
                opt.value = o;
                opt.textContent = o;
                selOoss.appendChild(opt);
              });
            }

            // Eventos de filtros
            const buscador = document.getElementById('buscador-live');
            if (buscador) {
              let debounce;
              buscador.addEventListener('input', e => {
                clearTimeout(debounce);
                debounce = setTimeout(() => {
                  filtros.texto = e.target.value.trim();
                  aplicarFiltros();
                }, 150);
              });
            }

            ['chip-inyectables', 'chip-delivery'].forEach(id => {
              const btn = document.getElementById(id);
              if (!btn) return;
              btn.addEventListener('click', () => {
                const field = btn.dataset.field;
                filtros[field] = !filtros[field];
                btn.classList.toggle('active', filtros[field]);
                btn.setAttribute('aria-pressed', String(filtros[field]));
                aplicarFiltros();
              });
            });

            if (selLoc) {
              selLoc.addEventListener('change', e => {
                filtros.localidad = e.target.value;
                selLoc.classList.toggle('active', !!e.target.value);
                aplicarFiltros();
              });
            }

            if (selOoss) {
              selOoss.addEventListener('change', e => {
                filtros.ooss = e.target.value;
                selOoss.classList.toggle('active', !!e.target.value);
                aplicarFiltros();
              });
            }

            renderCards(datosOriginales);

          } catch (err) {
            console.error('[BAHI.ar] Error al cargar laboratorios:', err);
            const contenedor = document.getElementById(CONTENEDOR_ID);
            if (contenedor) {
              contenedor.innerHTML = `
                <div class="error-state" role="alert">
                  <div class="error-state-icon" aria-hidden="true">⚠️</div>
                  <p class="error-state-title">No se pudo cargar la información</p>
                  <p class="error-state-desc">Revisá tu conexión e intentá de nuevo.</p>
                </div>`;
            }
          }
        }

        inicializar();

      }());
    </script>
