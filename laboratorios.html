    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>

    </div>

    <nav class="sub-nav" aria-label="Accesos rápidos">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link">Inicio</a></li>
            <li><a href="guardias.html" class="sub-nav-link">Guardias</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link active">Laboratorios</a></li>
        </ul>
    </nav>

    <div class="filter-chips-container" id="filter-chips-container">
      <select class="filter-chip-select" id="chip-localidad" aria-label="Filtrar por localidad">
        <option value="">Todas las localidades</option>
      </select>
      <select class="filter-chip-select" id="chip-ooss" aria-label="Filtrar por Obra Social">
        <option value="">Todas las OOSS</option>
      </select>
    </div>

    <main class="app-view" id="content">
        <div id="main-content">
            <div class="section-header">
                <div class="section-header-titles">
                    <h2>Laboratorios</h2>
                    <p class="section-header-meta">Análisis clínicos y bioquímicos</p>
                </div>
            </div>

            <div id="contenedor-cards" aria-live="polite" aria-label="Listado de laboratorios">
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="app.js" defer></script>
    <script defer>
      (function() {
        const TIPO_VISTA = 'LABORATORIO';
        const CONTENEDOR_ID = 'contenedor-cards';
        let datosOriginales = [];
        const filtros = { texto: '', localidad: '', ooss: '' };

        async function inicializar() {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          try {
            const res = await fetch('./data/bd_bahiar.json');
            if (!res.ok) throw new Error('Error al cargar datos');
            const data = await res.json();
            
            datosOriginales = data.filter(item => item.TIPO === 'LABORATORIO');
            
            // Configurar select de localidades
            const localidades = [...new Set(datosOriginales.map(i => i.LOCALIDAD).filter(Boolean))].sort();
            const selLocalidad = document.getElementById('chip-localidad');
            localidades.forEach(loc => {
              const opt = document.createElement('option');
              opt.value = loc;
              opt.textContent = loc;
              selLocalidad.appendChild(opt);
            });

            // Configurar select de OOSS
            const oossList = [...new Set(datosOriginales.map(i => i.OOSS).filter(Boolean))].sort();
            const selOoss = document.getElementById('chip-ooss');
            oossList.forEach(ooss => {
              const opt = document.createElement('option');
              opt.value = ooss;
              opt.textContent = ooss;
              selOoss.appendChild(opt);
            });

            // Eventos
            document.getElementById('buscador-live').addEventListener('input', (e) => {
              filtros.texto = e.target.value;
              renderizar();
            });

            selLocalidad.addEventListener('change', (e) => {
              filtros.localidad = e.target.value;
              selLocalidad.classList.toggle('active', !!e.target.value);
              renderizar();
            });

            selOoss.addEventListener('change', (e) => {
              filtros.ooss = e.target.value;
              selOoss.classList.toggle('active', !!e.target.value);
              renderizar();
            });

            renderizar();
          } catch (e) {
            console.error(e);
          }
        }

        function renderizar() {
          const contenedor = document.getElementById(CONTENEDOR_ID);
          const texto = filtros.texto.toLowerCase();
          
          const filtrados = datosOriginales.filter(item => {
            if (texto && !((item.PRESTADOR || '').toLowerCase().includes(texto) || (item.DOMICILIO || '').toLowerCase().includes(texto))) return false;
            if (filtros.localidad && item.LOCALIDAD !== filtros.localidad) return false;
            if (filtros.ooss && item.OOSS !== filtros.ooss) return false;
            return true;
          });

          if (typeof window.crearCardHTML !== 'function') {
            setTimeout(renderizar, 100);
            return;
          }

          contenedor.innerHTML = filtrados.map((item, i) => window.crearCardHTML(item, TIPO_VISTA, i)).join('');
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => setTimeout(inicializar, 50));
        } else {
          setTimeout(inicializar, 50);
        }
      })();
    </script>

                <line x1="9.5" y1="13.5" x2="14.5" y2="13.5"/>

    </nav>
