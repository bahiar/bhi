<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Laboratorios</title>
    
    <!-- Meta SEO para indexación -->
    <meta name="description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/laboratorios.html">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="BAHI.ar | Laboratorios">
    <meta property="og:description" content="Directorio de laboratorios de análisis clínicos en Bahía Blanca.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/laboratorios.html">
    <meta property="og:type" content="website">

    <!-- Metadatos PWA -->
    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      .filter-chips-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px 12px 16px;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        border-radius: 16px;
        border: 1.5px solid var(--accent, #4f46e5);
        background: transparent;
        color: var(--accent, #4f46e5);
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
      }
      .filter-chip.active {
        background: var(--accent, #4f46e5);
        color: #fff;
      }
      .filter-chip-select {
        border: 1.5px solid var(--accent, #4f46e5);
        border-radius: 16px;
        padding: 5px 10px;
        font-size: 13px;
        background: transparent;
        color: var(--accent, #4f46e5);
        cursor: pointer;
        outline: none;
        transition: background 0.15s, color 0.15s;
      }
      .filter-chip-select.active {
        background: var(--accent, #4f46e5);
        color: #fff;
      }
      .filter-chip-select option {
        background: #fff;
        color: #191971;
      }
    </style>
</head>
<body>

    <!-- Header único -->
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>
    </header>

    <!-- Buscador Global -->
    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" id="buscador-live" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips-container" id="filter-chips-container">
      <select class="filter-chip-select" id="chip-localidad" aria-label="Filtrar por localidad">
        <option value="">Todas las localidades</option>
      </select>
      <button class="filter-chip" id="chip-stock" data-field="STOCK" aria-pressed="false">Stock</button>
      <button class="filter-chip" id="chip-inyectables" data-field="INYECTABLES" aria-pressed="false">Inyectables</button>
      <button class="filter-chip" id="chip-delivery" data-field="DELIVERY" aria-pressed="false">Delivery</button>
      <select class="filter-chip-select" id="chip-ooss" aria-label="Filtrar por Obra Social">
        <option value="">Todas las OOSS</option>
      </select>
    </div>

    <!-- Contenido Principal -->
    <main class="app-view" id="content">
        <div id="main-content">
            <div style="padding: 16px;">
                <h2>Laboratorios</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                    Análisis clínicos y bioquímicos en la ciudad.
                </p>
            </div>

            <!-- AQUÍ SE CARGARÁN LOS DATOS AUTOMÁTICAMENTE -->
            <div id="contenedor-cards"></div>
            
        </div>
    </main>

    <!-- Navegación -->
    <div id="nav-placeholder"></div>
    <script src="app.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
            navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
        }
    </script>
    <script defer>
      // Sanitización de texto para interpolación segura en innerHTML (igual que app.js)
      function esc(str) {
        const d = document.createElement('div');
        d.textContent = str ?? '';
        return d.innerHTML;
      }

      function renderizarDatos(tipo, contenedorId) {
        const contenedor = document.getElementById(contenedorId);
        if (!contenedor) return;

        const renderCards = (lista) => {
          contenedor.innerHTML = '';
          if (lista.length === 0) {
            contenedor.innerHTML = '<p style="padding: 16px;">No hay datos disponibles.</p>';
            return;
          }
          const fragments = [];
          lista.forEach((item, index) => {
            const bodyId = `card-body-${tipo}-${index}`;
            let linkTel = item.FIJO ? item.FIJO : '';
            if (linkTel && !linkTel.toLowerCase().startsWith('tel:')) {
              linkTel = 'tel:' + linkTel;
            }
            let linkMovil = item.MOVIL ? item.MOVIL : '';
            if (linkMovil && !linkMovil.toLowerCase().startsWith('https://') && !linkMovil.toLowerCase().startsWith('tel:')) {
              linkMovil = 'tel:' + linkMovil;
            }
            fragments.push(`
<div class="card">
  <button class="card-header" aria-expanded="false" aria-controls="${bodyId}">
    <span>${esc(item.PRESTADOR)}</span>
    <span aria-hidden="true">▼</span>
  </button>
  <div class="card-body-collapse" id="${bodyId}">
    ${item.DOMICILIO ? `<p style="margin-bottom: 10px;"><strong>Dirección:</strong> ${esc(item.DOMICILIO)}</p>` : ''}
    ${item.LOCALIDAD ? `<p style="margin-bottom: 10px;"><strong>Localidad:</strong> ${esc(item.LOCALIDAD)}</p>` : ''}
    ${item.NIVEL ? `<p style="margin-bottom: 10px;"><strong>Nivel:</strong> ${esc(item.NIVEL)}</p>` : ''}
    ${item.ESTANDART ? `<p style="margin-bottom: 10px;"><strong>Estándar:</strong> ${esc(item.ESTANDART)}</p>` : ''}
    ${item.HORARIO ? `<p style="margin-bottom: 10px;"><strong>Horario:</strong> ${esc(item.HORARIO)}</p>` : ''}
    ${item.STOCK ? `<p style="margin-bottom: 10px;"><strong>Stock:</strong> ${esc(item.STOCK)}</p>` : ''}
    ${item.INYECTABLES ? `<p style="margin-bottom: 10px;"><strong>Inyectables:</strong> ${item.INYECTABLES ? 'Sí' : 'No'}</p>` : ''}
    ${item.DELIVERY ? `<p style="margin-bottom: 10px;"><strong>Delivery:</strong> ${item.DELIVERY ? 'Sí' : 'No'}</p>` : ''}
    ${item.OOSS ? `<p style="margin-bottom: 10px;"><strong>OOSS:</strong> ${esc(item.OOSS)}</p>` : ''}
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      ${item.FIJO ? `<a href="${esc(linkTel)}" class="btn btn-accent" aria-label="Llamar a ${esc(item.PRESTADOR)}, ${esc(item.FIJO)}">Llamar</a>` : ''}
      ${item.MOVIL ? `<a href="${esc(linkMovil)}" class="btn btn-accent" aria-label="WhatsApp de ${esc(item.PRESTADOR)}">WhatsApp</a>` : ''}
      ${item.MAPS ? `<a href="${esc(item.MAPS)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="Ver ${esc(item.PRESTADOR)} en Google Maps">Mapa</a>` : ''}
    </div>
  </div>
</div>`);
          });
          contenedor.innerHTML = fragments.join('');
        };

        contenedor.innerHTML = '<div style="padding: 16px; color: var(--text-muted);">Cargando...</div>';
        fetch('data/bd_bahiar.json')
          .then(response => response.json())
          .then(data => {
            const todosTipo = data.prestadores.filter(p => p.TIPO === tipo);

            // Poblar select de LOCALIDAD
            const selectLocalidad = document.getElementById('chip-localidad');
            if (selectLocalidad) {
              const localidades = [...new Set(todosTipo.map(p => p.LOCALIDAD).filter(Boolean))].sort();
              localidades.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                selectLocalidad.appendChild(opt);
              });
            }

            // Poblar select de OOSS
            const selectOoss = document.getElementById('chip-ooss');
            if (selectOoss) {
              const oossSet = new Set();
              todosTipo.forEach(p => {
                if (p.OOSS) {
                  p.OOSS.split(',').forEach(o => {
                    const trimmed = o.trim();
                    if (trimmed) oossSet.add(trimmed);
                  });
                }
              });
              [...oossSet].sort().forEach(ooss => {
                const opt = document.createElement('option');
                opt.value = ooss;
                opt.textContent = ooss;
                selectOoss.appendChild(opt);
              });
            }

            // Estado de filtros
            const filtros = {
              texto: '',
              localidad: '',
              stock: false,
              inyectables: false,
              delivery: false,
              ooss: ''
            };

            const aplicarFiltros = () => {
              const texto = filtros.texto.toLowerCase();
              const resultado = todosTipo.filter(item => {
                // Búsqueda en vivo: PRESTADOR y DOMICILIO
                if (texto) {
                  const enPrestador = (item.PRESTADOR || '').toLowerCase().includes(texto);
                  const enDomicilio = (item.DOMICILIO || '').toLowerCase().includes(texto);
                  if (!enPrestador && !enDomicilio) return false;
                }
                // Chip LOCALIDAD
                if (filtros.localidad && (item.LOCALIDAD || '') !== filtros.localidad) return false;
                // Chip STOCK (booleano: tiene valor no vacío)
                if (filtros.stock && !item.STOCK) return false;
                // Chip INYECTABLES (booleano)
                if (filtros.inyectables && !item.INYECTABLES) return false;
                // Chip DELIVERY (booleano)
                if (filtros.delivery && !item.DELIVERY) return false;
                // Chip OOSS (contiene la obra social)
                if (filtros.ooss) {
                  const oossItem = (item.OOSS || '').toLowerCase();
                  if (!oossItem.includes(filtros.ooss.toLowerCase())) return false;
                }
                return true;
              });
              renderCards(resultado);
            };

            // Evento búsqueda en vivo (usamos el ID específico para evitar conflictos)
            const buscador = document.getElementById('buscador-live');
            if (buscador) {
              buscador.addEventListener('input', (e) => {
                e.stopPropagation();
                filtros.texto = buscador.value;
                aplicarFiltros();
              });
            }

            // Chips booleanos
            ['chip-stock', 'chip-inyectables', 'chip-delivery'].forEach(id => {
              const btn = document.getElementById(id);
              if (!btn) return;
              const field = btn.getAttribute('data-field').toLowerCase();
              btn.addEventListener('click', () => {
                filtros[field] = !filtros[field];
                btn.classList.toggle('active', filtros[field]);
                btn.setAttribute('aria-pressed', filtros[field]);
                aplicarFiltros();
              });
            });

            // Select LOCALIDAD
            if (selectLocalidad) {
              selectLocalidad.addEventListener('change', () => {
                filtros.localidad = selectLocalidad.value;
                selectLocalidad.classList.toggle('active', !!selectLocalidad.value);
                aplicarFiltros();
              });
            }

            // Select OOSS
            if (selectOoss) {
              selectOoss.addEventListener('change', () => {
                filtros.ooss = selectOoss.value;
                selectOoss.classList.toggle('active', !!selectOoss.value);
                aplicarFiltros();
              });
            }

            // Render inicial
            renderCards(todosTipo);
          })
          .catch(error => {
            console.error('Error:', error);
            contenedor.innerHTML = '<p style="padding: 16px; color: red;">Error al cargar datos.</p>';
          });
      }

      // Sobrescribimos la inicialización para evitar que app.js llame a su propia versión
      window.addEventListener('load', () => {
        renderizarDatos('LABORATORIO', 'contenedor-cards');
      });
    </script>
</body>
</html>
