<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorios | BAHI.ar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="assets/images/logoweb.png" alt="BAHI.ar" class="logo-img">
            </a>
        </div>
    </header>

    <nav class="sub-nav">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link">Inicio</a></li>
            <li><a href="guardias.html" class="sub-nav-link">Emergencia</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link active">Laboratorios</a></li>
        </ul>
    </nav>

    <main class="app-view">
        <div class="desktop-layout-container">
            
            <aside class="desktop-sidebar">
                <div class="sidebar-sticky-content">
                    <h3 class="sidebar-title">Laboratorios</h3>
                    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
                        Directorio de laboratorios de análisis clínicos en Bahía Blanca y la zona.
                    </p>
                    <div style="background: rgba(31, 117, 254, 0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(31, 117, 254, 0.1);">
                        <span style="font-size: 12px; font-weight: 700; color: var(--accent);">INFO</span>
                        <p style="font-size: 13px; margin-top: 5px;">Podés filtrar por obra social o zona para encontrar el más cercano.</p>
                    </div>
                </div>
            </aside>

            <section class="main-content-area">
                <div class="section-header">
                    <h2>Laboratorios</h2>
                </div>

                <!-- Filtros (Chips) -->
                <div class="filter-chips-container">
                    <!-- Los filtros se inyectan vía JS -->
                </div>

                <div id="contenedor-cards" class="cards-grid">
                    <!-- Cards inyectadas por app.js -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

        </div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
