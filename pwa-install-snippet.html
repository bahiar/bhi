<!--
  ══════════════════════════════════════════════════════════════
  BANNER DE INSTALACIÓN PWA — BAHI.ar
  ══════════════════════════════════════════════════════════════
  Dónde pegarlo: justo antes del cierre </body> en index.html,
  DESPUÉS del <script src="app.js" defer> existente.

  El CSS vive en style.css (sección ── 18. BANNER DE INSTALACIÓN PWA ──)
  El JS vive en pwa-install.js (cargado con defer más abajo)

  El banner solo se muestra en móvil (<768px) y solo cuando:
    - Es la primera visita (localStorage.hasVisitedBefore no existía)
    - El navegador dispara beforeinstallprompt (Chrome/Edge/Samsung Android)
    - El usuario no dismisseó ni aceptó previamente

  En iOS Safari el banner nunca aparece porque ese navegador
  no soporta beforeinstallprompt. No se necesita manejo especial.
  ══════════════════════════════════════════════════════════════
-->

<!-- Banner de instalación (oculto por defecto, JS lo activa) -->
<div id="pwa-install-banner" role="complementary" aria-label="Instalar BAHI.ar">

    <!-- Ícono de la app -->
    <img
        src="assets/images/logoweb.png"
        alt=""
        class="pwa-banner-icon"
        width="44"
        height="44"
        aria-hidden="true"
        loading="lazy"
    >

    <!-- Texto -->
    <div class="pwa-banner-text">
        <p class="pwa-banner-title">Instalar BAHI.ar</p>
        <p class="pwa-banner-desc">Acceso rápido sin abrir el navegador</p>
    </div>

    <!-- Acciones -->
    <div class="pwa-banner-actions">
        <button id="pwa-btn-install" class="pwa-btn-install" type="button"
                aria-label="Instalar la aplicación BAHI.ar">
            Instalar
        </button>
        <button id="pwa-btn-dismiss" class="pwa-btn-dismiss" type="button"
                aria-label="Cerrar banner de instalación">
            ×
        </button>
    </div>

</div>

<!-- Módulo de instalación PWA (debe ir después de app.js) -->
<script src="pwa-install.js" defer></script>
