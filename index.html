<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Directorio de Salud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="assets/images/logoweb.png" alt="BAHI.ar" class="logo-img">
            </a>
            <!-- Buscador en header para desktop -->
            <div class="search-container desktop-only">
                <!-- ... buscador ... -->
            </div>
        </div>
    </header>

    <nav class="sub-nav">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link active">Inicio</a></li>
            <li><a href="guardias.html" class="sub-nav-link">Emergencia</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link">Laboratorios</a></li>
        </ul>
    </nav>

    <main class="app-view">
        <div class="desktop-layout-container">
            
            <!-- Sidebar Desktop: Solo visible en pantallas grandes -->
            <aside class="desktop-sidebar">
                <div class="sidebar-sticky-content">
                    <h3 class="sidebar-title">Guía Médica</h3>
                    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
                        Directorio oficial de salud para los vecinos de Bahía Blanca.
                    </p>
                    <div class="sidebar-nav">
                        <!-- Aquí puedes añadir filtros o accesos rápidos -->
                        <div style="background: var(--bg-main); padding: 15px; border-radius: 12px;">
                            <span style="font-size: 12px; font-weight: 700; color: var(--orange);">CONSEJO</span>
                            <p style="font-size: 13px; margin-top: 5px;">Las farmacias de turno cambian a las 8:30 hs cada día.</p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Contenido Principal -->
            <section class="main-content-area">
                <div class="section-header">
                    <h2>Farmacias de Turno</h2>
                    <p class="section-header-meta" id="leyenda-horario">Hasta las 8:30 hs de mañana</p>
                </div>

                <div id="contenedor-cards" class="cards-grid">
                    <!-- Las cards se inyectan vía JS (app.js) -->
                    <!-- Skeletons por defecto -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

        </div>
    </main>

    <!-- Bottom Nav para móvil -->
    <nav class="bottom-nav">
        <!-- ... items de navegación móvil ... -->
    </nav>

    <script src="app.js" defer></script>
</body>
</html>
