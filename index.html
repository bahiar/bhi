    <!--
        SCRIPTS AL FINAL DEL BODY:
        - app.js (que define crearCardHTML) carga primero.
        - El script inline espera a que crearCardHTML esté disponible.
        - Ambos con defer: no bloquean el render del HTML/CSS.
        - El usuario ya leyó el nombre + leyenda antes de que
          arranque cualquier línea de JavaScript.
    -->
    <script src="app.js" defer></script>

    <script defer>
        /**
         * Lógica de Farmacias de Turno — BAHI.ar
         * Ventana horaria de cambio: 08:30 hs ART.
         */
        (function () {
            'use strict';

            const CONFIG = {
                TIMEZONE:       'America/Argentina/Buenos_Aires',
                HORA_CAMBIO:    8,
                MINUTO_CAMBIO:  30,
                URL_TURNERO:    'data/turnero.json',
                URL_PADRON:     'data/bd_bahiar.json',
                /*
                 * MAX_REINTENTOS: cuántas veces esperar a que crearCardHTML
                 * esté disponible antes de mostrar error (100ms × 20 = 2s máx).
                 */
                MAX_REINTENTOS: 20
            };

            /**
             * Devuelve la fecha operativa en formato YYYY-MM-DD (ART).
             * Antes de las 08:30 se usa la fecha del día anterior,
             * porque el turno comenzó a las 08:30 de ayer.
             */
            function obtenerFechaOperativa() {
                const partes = new Intl.DateTimeFormat('en-CA', {
                    timeZone:  CONFIG.TIMEZONE,
                    year:      'numeric',
                    month:     '2-digit',
                    day:       '2-digit',
                    hour:      '2-digit',
                    minute:    '2-digit',
                    hour12:    false
                }).formatToParts(new Date());

                const p = {};
                partes.forEach(v => { p[v.type] = v.value; });

                const hora   = parseInt(p.hour,   10);
                const minuto = parseInt(p.minute, 10);
                const fecha  = new Date(`${p.year}-${p.month}-${p.day}T12:00:00Z`);

                const esMadrugada =
                    hora < CONFIG.HORA_CAMBIO ||
                    (hora === CONFIG.HORA_CAMBIO && minuto < CONFIG.MINUTO_CAMBIO);

                if (esMadrugada) {
                    fecha.setDate(fecha.getDate() - 1);
                }

                return fecha.toISOString().split('T')[0];
            }

            /**
             * Arma el texto comprimido del badge de sección y el context strip.
             * REDISEÑO: en lugar de 2 líneas largas genera textos cortos:
             *   badge:  "Hasta 8:30 de mañana (10 jun)"
             *   strip:  "3 de turno" / "Hasta 8:30 de mañana"
             */
            function armarLeyenda(fechaOp) {
                const meses = [
                    'enero','febrero','marzo','abril','mayo','junio',
                    'julio','agosto','septiembre','octubre','noviembre','diciembre'
                ];
                const mesesCortos = [
                    'ene','feb','mar','abr','may','jun',
                    'jul','ago','sep','oct','nov','dic'
                ];
                const dInicio = new Date(fechaOp + 'T12:00:00Z');
                const dFin    = new Date(dInicio);
                dFin.setUTCDate(dFin.getUTCDate() + 1);

                const mañanaTxt      = `${dFin.getUTCDate()} de ${meses[dFin.getUTCMonth()]}`;
                const mañanaCortoTxt = `${dFin.getUTCDate()} ${mesesCortos[dFin.getUTCMonth()]}`;

                return {
                    /* Para el badge .section-header-meta junto al h2 */
                    badge: `Hasta 8:30 de mañana (${mañanaTxt})`,
                    /* Para el context strip del header */
                    strip: `Hasta 8:30 de mañana · ${mañanaCortoTxt}`
                };
            }

            /**
             * Muestra el estado de error en el contenedor de cards.
             * Reemplaza los skeletons con un mensaje claro y accionable.
             */
            function mostrarError(contenedor, mensaje) {
                contenedor.innerHTML = `
                    <div class="error-state" role="alert">
                        <div class="error-state-icon" aria-hidden="true">⚠️</div>
                        <p class="error-state-title">No se pudo cargar la información</p>
                        <p class="error-state-desc">${mensaje}<br>Revisá tu conexión e intentá de nuevo.</p>
                    </div>`;
            }

            /**
             * Carga turnero + padrón en paralelo, determina el grupo
             * del día y renderiza las tarjetas.
             *
             * Si crearCardHTML todavía no está disponible (app.js aún
             * no terminó de ejecutarse), reintenta hasta MAX_REINTENTOS.
             */
            async function inicializarTurnos(reintentos) {
                reintentos = reintentos || 0;

                const contenedor     = document.getElementById('contenedor-cards');
                const leyendaHorario = document.getElementById('leyenda-horario');
                if (!contenedor) return;

                try {
                    /*
                     * Promise.all: descarga turnero y padrón en paralelo.
                     * En 3G (~1.5 Mbps) esto ahorra ~300-500 ms respecto
                     * a hacerlo secuencial.
                     */
                    const [resT, resP] = await Promise.all([
                        fetch(CONFIG.URL_TURNERO),
                        fetch(CONFIG.URL_PADRON)
                    ]);

                    if (!resT.ok || !resP.ok) {
                        throw new Error('Error HTTP al descargar datos');
                    }

                    const turnero = await resT.json();
                    const padron  = await resP.json();
                    const fechaOp = obtenerFechaOperativa();
                    const entrada = turnero.find(t => t.fecha === fechaOp);

                    if (!entrada) {
                        throw new Error(`Fecha ${fechaOp} no encontrada en el turnero`);
                    }

                    const grupoActual = entrada.grupo;

                    /* Filtrar farmacias del grupo con teléfono disponible */
                    const deTurno = padron.prestadores.filter(f =>
                        f.TIPO  === 'FARMACIA' &&
                        f.GRUPO === grupoActual &&
                        (f.FIJO || f.MOVIL)
                    );

                    /* ── Hidratar badge junto al h2 ── */
                    const leyenda = armarLeyenda(fechaOp);
                    if (leyendaHorario) {
                        leyendaHorario.textContent = leyenda.badge;
                    }

                    if (deTurno.length === 0) {
                        contenedor.innerHTML = `
                            <div class="error-state">
                                <div class="error-state-icon" aria-hidden="true">🔍</div>
                                <p class="error-state-title">Sin farmacias registradas</p>
                                <p class="error-state-desc">No hay farmacias registradas para el Grupo ${grupoActual} con teléfono disponible.</p>
                            </div>`;
                        return;
                    }

                    /*
                     * crearCardHTML es definida en app.js (carga con defer).
                     * Si aún no está lista, esperamos 100ms y reintentamos.
                     */
                    if (typeof window.crearCardHTML !== 'function') {
                        if (reintentos >= CONFIG.MAX_REINTENTOS) {
                            throw new Error('crearCardHTML no disponible tras reintentos');
                        }
                        setTimeout(() => inicializarTurnos(reintentos + 1), 100);
                        return;
                    }

                    /* Renderizar cards */
                    contenedor.innerHTML = deTurno
                        .map((f, i) => window.crearCardHTML(f, 'TURNO', i))
                        .join('');

                } catch (err) {
                    console.error('[BAHI.ar] Fallo al inicializar turnos:', err);
                    mostrarError(contenedor, err.message);
                }
            }

            /* Iniciar carga */
            inicializarTurnos();

        })();
    </script>

    <!-- ── BANNER DE INSTALACIÓN PWA ── -->
    <!--
        Solo visible en móvil (<768px) y solo cuando:
          · Es la primera visita (localStorage.hasVisitedBefore no existía)
          · El navegador dispara beforeinstallprompt (Chrome/Edge Android)
          · El usuario no dismisseó ni aceptó previamente
        En iOS Safari el banner nunca aparece (no soporta beforeinstallprompt).
    -->
    <div id="pwa-install-banner" role="complementary" aria-label="Instalar BAHI.ar">
        <img
            src="assets/images/logoweb.png"
            alt=""
            class="pwa-banner-icon"
            width="44"
            height="44"
            aria-hidden="true"
            loading="lazy"
        >
        <div class="pwa-banner-text">
            <p class="pwa-banner-title">Instalar BAHI.ar</p>
            <p class="pwa-banner-desc">Acceso rápido sin abrir el navegador</p>
        </div>
        <div class="pwa-banner-actions">
            <button id="pwa-btn-install" class="pwa-btn-install" type="button"
                    aria-label="Instalar la aplicación BAHI.ar">
                Instalar
            </button>
            <button id="pwa-btn-dismiss" class="pwa-btn-dismiss" type="button"
                    aria-label="Cerrar banner de instalación">
                ×
            </button>
        </div>
    </div>

    <script defer>
        /**
         * BAHI.ar — Módulo de Instalación PWA
         * ─────────────────────────────────────
         * localStorage keys:
         *   hasVisitedBefore  — se crea en la primera visita.
         *   installDismissed  — usuario cerró el banner con × o rechazó el diálogo.
         *   installAccepted   — usuario aceptó, o la app se instaló por otra vía.
         */
        'use strict';

        (function () {
            const LS_VISITED   = 'hasVisitedBefore';
            const LS_DISMISSED = 'installDismissed';
            const LS_ACCEPTED  = 'installAccepted';

            let deferredPrompt = null;

            function debesMostrarBanner() {
                return (
                    !localStorage.getItem(LS_DISMISSED) &&
                    !localStorage.getItem(LS_ACCEPTED)
                );
            }

            function getBanner() {
                return document.getElementById('pwa-install-banner');
            }

            function mostrarBanner() {
                const b = getBanner();
                if (b) b.classList.add('visible');
            }

            function ocultarBanner() {
                const b = getBanner();
                if (b) b.classList.remove('visible');
            }

            /* 1. Marca primera visita */
            if (!localStorage.getItem(LS_VISITED)) {
                localStorage.setItem(LS_VISITED, '1');
            }

            /* 2. Captura beforeinstallprompt */
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                if (!debesMostrarBanner()) return;
                deferredPrompt = e;
                /* Delay de 1.5s para que el usuario vea el contenido primero */
                setTimeout(mostrarBanner, 1500);
            });

            /* 3. Botón Instalar */
            document.addEventListener('click', async (e) => {
                if (!e.target.closest('#pwa-btn-install')) return;
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                localStorage.setItem(outcome === 'accepted' ? LS_ACCEPTED : LS_DISMISSED, '1');
                deferredPrompt = null;
                ocultarBanner();
            });

            /* 4. Botón × (dismiss) */
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#pwa-btn-dismiss')) return;
                localStorage.setItem(LS_DISMISSED, '1');
                deferredPrompt = null;
                ocultarBanner();
            });

            /* 5. Instalación completada por cualquier vía */
            window.addEventListener('appinstalled', () => {
                localStorage.setItem(LS_ACCEPTED, '1');
                deferredPrompt = null;
                ocultarBanner();
            });

        }());
    </script>
