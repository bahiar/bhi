<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Directorio de Salud</title>
    <meta name="description" content="Directorio de salud, farmacias y guardias en Bahía Blanca.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/">
    <link rel="manifest" href="manifest.json">

    <!--
        PRELOAD: Le dice al navegador que busque el CSS de forma
        inmediata, sin esperar al parser HTML. Elimina el FOUC
        (flash de texto sin estilo) especialmente notorio en 3G.
    -->
    <link rel="preload" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="BAHI.ar | Directorio de Salud">
    <meta property="og:description" content="Directorio de salud, farmacias y guardias en Bahía Blanca.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://bahiar.github.io/bhi/assets/images/logoweb.png">

    <!-- PWA / iOS -->
    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <header class="main-header">
        <!-- BUSCADOR SOBRE EL HEADER (Reposicionado) -->
        <div class="search-container header-search">
            <div class="search-icon" aria-hidden="true">🔍</div>
            <input
                type="text"
                placeholder="Buscar en BAHI.ar..."
                aria-label="Buscar en BAHI.ar"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >
        </div>

        <div class="header-content">
            <a href="index.html" class="brand-logo" aria-label="BAHI.ar – Inicio">
                <img src="assets/images/logoweb.png" alt="BAHI.ar" class="logo-img" width="120" height="36">
            </a>
        </div>
        
        <!--
            CONTEXT STRIP: muestra la info más urgente antes de cualquier scroll.
            Está en el HTML estático → se pinta en el primer repaint, sin esperar JS.
        -->
        <div class="header-ctx-strip" id="header-ctx-strip" aria-live="polite">
            <span class="ctx-live" aria-label="Farmacias de turno activas">
                <span class="ctx-live-dot" aria-hidden="true"></span>
                <span id="ctx-count">Cargando…</span>
            </span>
            <span class="ctx-sep" aria-hidden="true"></span>
            <span class="ctx-text" id="ctx-horario"></span>
        </div>
    </header>

    <nav class="sub-nav" aria-label="Secciones principales">
        <ul class="sub-nav-list">
            <li><a href="index.html"        class="sub-nav-link active" aria-current="page">Inicio</a></li>
            <li><a href="guardias.html"     class="sub-nav-link">Guardias</a></li>
            <li><a href="farmacias.html"    class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link">Laboratorios</a></li>
        </ul>
    </nav>

    <main class="app-view" id="content">
        <div id="main-content">

            <div class="section-header">
                <div class="section-header-titles">
                    <h2 id="titulo-home">Farmacias de Turno</h2>
                    <p class="section-header-meta" id="leyenda-horario" aria-live="polite"></p>
                </div>
                <button id="btn-compartir-whatsapp" class="btn-share-wa" aria-label="Compartir farmacias por WhatsApp">
                    <svg width="18" height="18" viewBox="0 0 448 512" fill="currentColor">
                        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.3-16.4-14.6-27.4-32.7-30.6-38.2-3.2-5.6-.3-8.6 2.4-11.3 2.5-2.4 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.6 5.5-9.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.7 23.5 9.2 31.6 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.5 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                    </svg>
                    <span>Compartir</span>
                </button>
            </div>

            <div id="contenedor-cards" aria-live="polite" aria-label="Farmacias de turno">
                <div class="skeleton-card" aria-hidden="true">
                    <div class="skeleton-line skeleton-line-title"></div>
                    <div class="skeleton-line skeleton-line-addr"></div>
                    <div class="skeleton-btns">
                        <div class="skeleton-line skeleton-btn"></div>
                        <div class="skeleton-line skeleton-btn"></div>
                    </div>
                </div>
                <!-- ... otros skeletons ... -->
            </div>

        </div>
    </main>

    <script src="app.js" defer></script>
    <script defer>
        (function() {
            const CONFIG = {
                URL_TURNERO: './data/turnero.json',
                MAX_REINTENTOS: 5
            };

            async function inicializarTurnos(reintentos = 0) {
                const contenedor = document.getElementById('contenedor-cards');
                const ctxCount = document.getElementById('ctx-count');
                const ctxHorario = document.getElementById('ctx-horario');
                const leyendaHorario = document.getElementById('leyenda-horario');

                try {
                    const res = await fetch(CONFIG.URL_TURNERO);
                    if (!res.ok) throw new Error('Error al cargar turnero');
                    const data = await res.json();
                    
                    const deTurno = data.farmacias || [];
                    const horario = data.horario_leyenda || '';

                    if (ctxCount) ctxCount.textContent = `${deTurno.length} de turno`;
                    if (ctxHorario) ctxHorario.textContent = horario;
                    if (leyendaHorario) leyendaHorario.textContent = horario;

                    if (typeof window.crearCardHTML !== 'function') {
                        if (reintentos >= CONFIG.MAX_REINTENTOS) throw new Error('crearCardHTML no disponible');
                        setTimeout(() => inicializarTurnos(reintentos + 1), 100);
                        return;
                    }

                    contenedor.innerHTML = deTurno
                        .map((f, i) => window.crearCardHTML(f, 'TURNO', i))
                        .join('');

                } catch (err) {
                    console.error('[BAHI.ar] Fallo al inicializar turnos:', err);
                }
            }

            inicializarTurnos();
        })();
    </script>

    <!-- ── BOTTOM NAVIGATION BAR ── -->
    <nav class="bottom-nav" aria-label="Navegación principal">
        <!-- ... items de navegación ... -->
    </nav>

</body>
</html>
