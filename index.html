<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Directorio de Salud</title>
    
    <meta name="description" content="Directorio de salud, farmacias y guardias en Bahía Blanca.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta property="og:title" content="BAHI.ar | Directorio de Salud">
    <meta property="og:description" content="Directorio de salud, farmacias y guardias en Bahía Blanca.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>
    </header>

    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <nav class="sub-nav" aria-label="Accesos rápidos">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link active">Inicio</a></li>
            <li><a href="guardias.html" class="sub-nav-link">Guardias</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link">Laboratorios</a></li>
        </ul>
    </nav>

    <main class="app-view" id="content">
        <div id="main-content">
            <div style="padding: 16px;">
                <h2 id="titulo-home">Farmacias de Turno</h2>
                <p id="info-turno" style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                    Cargando información de guardia...
                </p>
            </div>

            <div id="contenedor-cards"></div>
        </div>
    </main>

  
    <script src="app.js" defer></script>
    <script defer>
        /**
         * Lógica de Farmacias de Turno integrada para BAHI.ar
         * Ventana horaria: 08:30 hs. Zona horaria: ART.
         */
        (function() {
            const CONFIG = {
                TIMEZONE: 'America/Argentina/Buenos_Aires',
                HORA_CAMBIO: 8,
                MINUTO_CAMBIO: 30,
                URL_TURNERO: 'data/turnero.json',
                URL_PADRON: 'data/bd_bahiar.json'
            };

            function obtenerFechaOperativa() {
                const ahora = new Intl.DateTimeFormat('en-CA', {
                    timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: false
                }).formatToParts(new Date());

                const p = {}; ahora.forEach(v => p[v.type] = v.value);
                const h = parseInt(p.hour); const m = parseInt(p.minute);
                const fecha = new Date(`${p.year}-${p.month}-${p.day}T12:00:00Z`);

                if (h < CONFIG.HORA_CAMBIO || (h === CONFIG.HORA_CAMBIO && m < CONFIG.MINUTO_CAMBIO)) {
                    fecha.setDate(fecha.getDate() - 1);
                }
                return fecha.toISOString().split('T')[0];
            }

            async function inicializarTurnos() {
                const contenedor = document.getElementById('contenedor-cards');
                const infoTurno = document.getElementById('info-turno');
                if (!contenedor) return;

                try {
                    const [resT, resP] = await Promise.all([fetch(CONFIG.URL_TURNERO), fetch(CONFIG.URL_PADRON)]);
                    const turnero = await resT.json();
                    const padron = await resP.json();

                    const fechaOp = obtenerFechaOperativa();
                    const entrada = turnero.find(t => t.fecha === fechaOp);
                    
                    if (!entrada) throw new Error("Fecha no encontrada en turnero");

                    const grupoActual = entrada.grupo; // Ejemplo: "F"
                    infoTurno.textContent = `Grupo de Guardia: ${grupoActual} | Fecha: ${fechaOp.split('-').reverse().join('/')}`;

                    // CORRECCIÓN TÉCNICA: El campo en el JSON es "GRUPO" (en mayúsculas)
                    const deTurno = padron.prestadores.filter(f => 
                        f.TIPO === 'FARMACIA' && 
                        f.GRUPO === grupoActual && 
                        (f.FIJO || f.MOVIL)
                    );

                    if (deTurno.length === 0) {
                        contenedor.innerHTML = `<p style="padding: 16px;">No se encontraron farmacias registradas para el Grupo ${grupoActual}.</p>`;
                        return;
                    }

                    // Renderizado utilizando la función universal de app.js
                    if (typeof window.crearCardHTML === 'function') {
                        contenedor.innerHTML = deTurno.map((item, i) => window.crearCardHTML(item, 'TURNO', i)).join('');
                    } else {
                        // Fallback por si app.js tarda en cargar
                        contenedor.innerHTML = '<p style="padding: 16px;">Cargando interfaz...</p>';
                        setTimeout(inicializarTurnos, 100);
                    }

                } catch (e) {
                    console.error(e);
                    contenedor.innerHTML = '<p style="padding: 16px; color: red;">Error al cargar las farmacias de turno.</p>';
                    infoTurno.textContent = "No se pudo cargar la información de guardia.";
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => setTimeout(inicializarTurnos, 150));
            } else {
                setTimeout(inicializarTurnos, 150);
            }
        })();
    </script>
</body>
</html>
