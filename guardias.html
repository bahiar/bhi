<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Guardias</title>
    
    <meta name="description" content="Guardias médicas de urgencia en Bahía Blanca. Hospitales y clínicas con atención 24 horas.">
    <link rel="canonical" href="https://bahiar.github.io/bhi/guardias.html">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta property="og:title" content="BAHI.ar | Guardias">
    <meta property="og:description" content="Guardias médicas de urgencia en Bahía Blanca. Hospitales y clínicas con atención 24 horas.">
    <meta property="og:url" content="https://bahiar.github.io/bhi/guardias.html">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#191971">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>


    </header>

    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <nav class="sub-nav" aria-label="Accesos rápidos">
        <ul class="sub-nav-list">
            <li><a href="index.html" class="sub-nav-link">Inicio</a></li>
            <li><a href="guardias.html" class="sub-nav-link active">Guardias</a></li>
            <li><a href="farmacias.html" class="sub-nav-link">Farmacias</a></li>
            <li><a href="laboratorios.html" class="sub-nav-link">Laboratorios</a></li>
        </ul>
    </nav>

    <main class="app-view" id="content">
        <div id="main-content">

            <!-- ── SECCIÓN: EMERGENCIAS ── -->
            <div class="section-header">
                <h2>Emergencias médicas</h2>
            </div>
            <div id="contenedor-emergencias" style="padding: 0 16px 8px;"></div>

            <!-- Separador visual entre secciones -->
            <div class="section-divider"></div>

            <!-- ── SECCIÓN: AMBULANCIAS ── -->
            <div class="section-header">
                <h2>Servicios de ambulancias</h2>
            </div>
            <div id="contenedor-ambulancias" style="padding: 0 16px 8px;"></div>

            <!-- Separador visual entre secciones -->
            <div class="section-divider"></div>

            <!-- ── SECCIÓN: GUARDIAS MÉDICAS ── -->
            <div class="section-header">
                <h2>Guardias Médicas</h2>
                <p class="section-header-meta">Atención 24 hs.</p>
            </div>

            <div id="contenedor-cards"></div>
        </div>
    </main>

  
    <script src="app.js" defer></script>
    <script defer>
      /**
       * Renderizado de Guardias + Emergencias
       */
      document.addEventListener('DOMContentLoaded', () => {
          setTimeout(() => {
              // ── Guardias médicas ──
              const contenedor = document.getElementById('contenedor-cards');
              if (contenedor && typeof window.crearCardHTML === 'function') {
                  const guardiasEstaticas = [
                      { PRESTADOR: "Hospital Municipal Dr. Leónidas Lucero", DOMICILIO: "Estomba 968", FIJO: "02914598484", MAPS: "https://maps.google.com/?cid=16810520313590473464", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Interzonal General Dr José Penna", DOMICILIO: "Av. Lainez 2401", FIJO: "02914593600", MAPS: "https://maps.google.com/?cid=16307574064946898385", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Privado del Sur", DOMICILIO: "Las Heras 164", FIJO: "02914550270", MAPS: "https://maps.google.com/?cid=4096557740069257162", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital de la Asociación Médica Dr. Felipe Glasman", DOMICILIO: "Patricios 347", FIJO: "02914557877", MAPS: "https://maps.google.com/?cid=5361214841895970615", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Italiano Regional del Sur", DOMICILIO: "Necochea 675", FIJO: "02914583100", MAPS: "https://maps.google.com/?cid=3736778501007264660", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Regional Español", DOMICILIO: "Estomba 571", FIJO: "02914595555", MAPS: "https://maps.google.com/?cid=2064372742749592359", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Dr. Raúl Matera", DOMICILIO: "9 de Julio 461", FIJO: "02914558880", MAPS: "https://maps.google.com/?cid=13981706602155362647", HORARIO: "24 hs" }
                  ];
                  contenedor.innerHTML = guardiasEstaticas.map((item, i) => window.crearCardHTML(item, 'GUARDIA', i)).join('');
              }

              // ── Emergencias médicas (107) ──
              const contEmergencias = document.getElementById('contenedor-emergencias');
              if (contEmergencias) {
                  // Card especial para el 107: destacada con estado "urgencia"
                  contEmergencias.innerHTML = `
                  <article class="card card-emergencia" data-tipo="EMERGENCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">107</h3>
                              <p class="card-addr card-phone-visible">Servicio de Emergencias Médicas</p>
                          </div>
                          <a href="tel:107" class="btn btn-accent" aria-label="Llamar al 107 - Emergencias médicas">📞 Llamar</a>
                      </div>
                  </article>`;
              }

              // ── Servicios de ambulancias ──
              // SUGERENCIA 3: número visible directamente, sin requerir tap extra
              const contAmbulancias = document.getElementById('contenedor-ambulancias');
              if (contAmbulancias) {
                  contAmbulancias.innerHTML = `
                  <!-- SEM Emergencias Médicas -->
                  <article class="card" data-tipo="AMBULANCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">SEM Emergencias Médicas</h3>
                              <!-- SUGERENCIA 3: teléfono principal visible sin acordeón -->
                              <p class="card-addr card-phone-visible">(0291) 459-1919</p>
                          </div>
                      </div>
                      <div class="card-actions">
                          <a href="tel:02914591919" class="btn btn-accent" aria-label="Llamar a SEM Emergencias Médicas">📞 Llamar</a>
                          <a href="https://wa.me/5492916492840" class="btn btn-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de SEM Emergencias Médicas">WhatsApp</a>
                      </div>
                  </article>

                  <!-- Alerta Emergencias Médicas -->
                  <article class="card" data-tipo="AMBULANCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">Alerta Emergencias Médicas</h3>
                              <!-- SUGERENCIA 3: teléfono principal visible sin acordeón -->
                              <p class="card-addr card-phone-visible">(0291) 455-3388</p>
                          </div>
                      </div>
                      <div class="card-actions">
                          <a href="tel:02914553388" class="btn btn-accent" aria-label="Llamar a Alerta Emergencias Médicas - línea principal">📞 Llamar</a>
                      </div>
                      <!-- Acordeón solo para los números alternativos -->
                      <button class="card-header" aria-expanded="false" aria-controls="alerta-alt-phones">
                          <span>Más teléfonos</span>
                          <span class="card-chevron" aria-hidden="true">▼</span>
                      </button>
                      <div class="card-body-collapse" id="alerta-alt-phones" role="region" aria-label="Teléfonos alternativos de Alerta Emergencias Médicas">
                          <p class="card-detail-row"><strong>Alternativo:</strong> <a href="tel:02914560000" class="card-phone-link">(0291) 456-0000</a></p>
                          <p class="card-detail-row"><strong>Alternativo:</strong> <a href="tel:02914562076" class="card-phone-link">(0291) 456-2076</a></p>
                      </div>
                  </article>`;
              }

          }, 150);
      });
    </script>
</body>
</html>
