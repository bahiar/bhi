<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHI.ar | Guardias</title>
    
    <meta name="description" content="Directorio de salud, farmacias y guardias en Bahía Blanca.">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header (Solo contiene el logo) -->
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">BAHI<span>.ar</span></a>
        </div>
    </header>

    <!-- Buscador Global -->
    <div class="search-container">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input type="text" placeholder="Buscar en BAHI.ar..." aria-label="Buscar en BAHI.ar">
    </div>

    <!-- Contenido Principal (Aquí van las Guardias) -->
    <main class="app-view" id="content">
        <div id="main-content">
            <div style="padding: 16px;">
                <h2>Guardias Médicas</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                    Directorio de salud Bahía Blanca.
                </p>
            </div>

            <!-- Contenedor para el renderizado dinámico -->
            <div id="contenedor-cards"></div>
        </div>
    </main>

    <!-- Navegación -->
    <div id="nav-placeholder"></div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
      // Renderizar guardias usando los datos estáticos definidos en app.js
      renderizarDatos('GUARDIA', 'contenedor-cards');
    </script>
</body>
</html>
