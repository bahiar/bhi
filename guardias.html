      /**
       * Renderizado de Guardias + Emergencias
       */

          setTimeout(() => {
              // ── Guardias médicas ──
              const contenedor = document.getElementById('contenedor-cards');
              if (contenedor && typeof window.crearCardHTML === 'function') {
                  const guardiasEstaticas = [
                      { PRESTADOR: "Hospital Municipal Dr. Leónidas Lucero", DOMICILIO: "Estomba 968", FIJO: "02914598484", MAPS: "https://maps.google.com/?cid=16810520313590473464", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Interzonal General Dr José Penna", DOMICILIO: "Av. Lainez 2401", FIJO: "02914593600", MAPS: "https://maps.google.com/?cid=16307574064946898385", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Privado del Sur", DOMICILIO: "Las Heras 164", FIJO: "02914550270", MAPS: "https://maps.google.com/?cid=4096557740069257162", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital de la Asociación Médica Dr. Felipe Glasman", DOMICILIO: "Patricios 347", FIJO: "02914557877", MAPS: "https://maps.google.com/?cid=5361214841895970615", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Italiano Regional del Sur", DOMICILIO: "Necochea 675", FIJO: "02914583100", MAPS: "https://maps.google.com/?cid=3736778501007264660", HORARIO: "24 hs" },
                      { PRESTADOR: "Hospital Regional Español", DOMICILIO: "Estomba 571", FIJO: "02914595555", MAPS: "https://maps.google.com/?cid=2064372742749592359", HORARIO: "24 hs" },

                  ];
                  contenedor.innerHTML = guardiasEstaticas.map((item, i) => window.crearCardHTML(item, 'GUARDIA', i)).join('');
              }

              // ── Emergencias médicas (107) ──
              const contEmergencias = document.getElementById('contenedor-emergencias');
              if (contEmergencias) {
                  // Card especial para el 107: destacada con estado "urgencia"
                  contEmergencias.innerHTML = `
                  <article class="card card-emergencia" data-tipo="EMERGENCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">107</h3>
                              <p class="card-addr">Servicio de Emergencias Médicas</p>
                          </div>
                      </div>
                      <div class="card-actions">
                          <a href="tel:107" class="btn btn-accent" aria-label="Llamar al 107 - Emergencias médicas">📞 Llamar</a>
                      </div>
                  </article>`;
              }

              // ── Servicios de ambulancias ──
              // SUGERENCIA 3: número visible directamente, sin requerir tap extra
              const contAmbulancias = document.getElementById('contenedor-ambulancias');
              if (contAmbulancias) {
                  contAmbulancias.innerHTML = `
                  <!-- SEM Emergencias Médicas -->
                  <article class="card" data-tipo="AMBULANCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">SEM Emergencias Médicas</h3>
                              <p class="card-addr">(0291) 459-1919</p>
                          </div>
                      </div>
                      <div class="card-actions">
                          <a href="tel:02914591919" class="btn btn-accent" aria-label="Llamar a SEM Emergencias Médicas">📞 Llamar</a>
                          <a href="https://wa.me/5492916492840" class="btn btn-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de SEM Emergencias Médicas">WhatsApp</a>
                      </div>
                  </article>

                  <!-- Alerta Emergencias Médicas -->
                  <article class="card" data-tipo="AMBULANCIA">
                      <div class="card-top">
                          <div class="card-info">
                              <h3 class="card-name">Alerta Emergencias Médicas</h3>
                              <p class="card-addr">(0291) 455-3388</p>
                          </div>
                      </div>
                      <div class="card-actions">
                          <a href="tel:02914553388" class="btn btn-accent" aria-label="Llamar a Alerta Emergencias Médicas - línea principal">📞 Llamar</a>
                      </div>
                      <button class="card-header" aria-expanded="false" aria-controls="alerta-alt-phones">
                          <span>Más información</span>
                          <span class="card-chevron" aria-hidden="true">▼</span>
                      </button>
                      <div class="card-body-collapse" id="alerta-alt-phones" role="region" aria-label="Teléfonos alternativos de Alerta Emergencias Médicas">

                          <p class="card-detail-row"><strong>Alternativo:</strong> <a href="tel:02914562076" class="card-phone-link">(0291) 456-2076</a></p>
                      </div>
                  </article>`;
              }

          }, 150);
