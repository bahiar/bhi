<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="rounded-corners">
      <rect x="0" y="0" width="512" height="512" rx="80" ry="80" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#rounded-corners)">
    <polygon points="0,0 512,0 0,512" fill="#FF6B00" />
    <polygon points="512,0 512,512 0,512" fill="#0B1B3D" />
  </g>
  
  <g fill="#FFFFFF">
    <rect x="128" y="216" width="256" height="80" rx="15" ry="15" />
    <rect x="216" y="128" width="80" height="256" rx="15" ry="15" />
  </g>
</svg>
