  :root {

    --panel: #161922;
    --line: #262a36;
    --text: #e8eaef;
    --muted: #8b92a5;
    --accent: #5ee6c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 60px;
  }
  header {
    max-width: 720px;
    margin: 0 auto 32px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .grid {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .icon-box {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-box svg {
    width: 28px;
    height: 28px;
    stroke: var(--text);
  }
  .name {
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
    text-align: center;
  }
  button {
    font-size: 12px;
    font-weight: 500;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button.copied {
    background: var(--text);
  }
  footer {
    max-width: 720px;
    margin: 28px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>

const grid = document.getElementById('grid');

icons.forEach(icon => {
  const card = document.createElement('div');
  card.className = 'card';

  const iconBox = document.createElement('div');
  iconBox.className = 'icon-box';
  iconBox.innerHTML = icon.svg;

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = icon.name;

  const btn = document.createElement('button');
  btn.textContent = 'Copiar SVG';
  btn.addEventListener('click', async () => {
    const markCopied = () => {
      btn.textContent = '¡Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copiar SVG';
        btn.classList.remove('copied');
      }, 1500);
    };

    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(icon.svg);
        markCopied();
        return;
      } catch (e) {
        // sigue al método alternativo
      }
    }

    // Fallback para contextos no seguros (file://, http sin TLS, etc.)
    try {
      const textarea = document.createElement('textarea');
      textarea.value = icon.svg;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      markCopied();
    } catch (e) {
      btn.textContent = 'Error al copiar';
      setTimeout(() => { btn.textContent = 'Copiar SVG'; }, 1500);
    }
  });

  card.appendChild(iconBox);
  card.appendChild(name);
  card.appendChild(btn);
  grid.appendChild(card);
});
