<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería SVG – cuadros</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  header {
    background: #1a1d2e;
    border-bottom: 1px solid #2d3148;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1rem;
    color: #a78bfa;
  }

  .logo svg { width: 22px; height: 22px; }

  .path-label {
    font-size: 0.75rem;
    color: #64748b;
    font-family: monospace;
    background: #12141f;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #2d3148;
  }

  #btn-refresh {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #6d28d9;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  #btn-refresh:hover { background: #7c3aed; }
  #btn-refresh:active { transform: scale(.97); }
  #btn-refresh.spinning svg { animation: spin .7s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  #status {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
    font-size: 0.95rem;
  }

  #count {
    font-size: 0.8rem;
    color: #64748b;
    padding: 10px 24px 0;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px 24px 40px;
  }

  .card {
    background: #1a1d2e;
    border: 1px solid #2d3148;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #6d28d9; transform: translateY(-2px); }

  .preview {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 160px;
    padding: 12px;
    overflow: hidden;
  }
  .preview img {
    max-width: 100%;
    max-height: 136px;
    object-fit: contain;
  }

  .info {
    padding: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .filename {
    font-size: 0.78rem;
    font-weight: 600;
    color: #c4b5fd;
    word-break: break-all;
    font-family: monospace;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: auto;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background .15s, opacity .15s;
    width: 100%;
  }

  .btn-url  { background: #1e3a5f; color: #60a5fa; }
  .btn-url:hover  { background: #1e4a7f; }
  .btn-code { background: #1a3a2a; color: #4ade80; }
  .btn-code:hover { background: #1a4a35; }
  .btn-view { background: #2d1a3e; color: #d8b4fe; }
  .btn-view:hover { background: #3d2550; }

  .btn.copied {
    opacity: .7;
    pointer-events: none;
  }

  /* Modal */
  #modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-bg.open { display: flex; }

  #modal {
    background: #1a1d2e;
    border: 1px solid #6d28d9;
    border-radius: 14px;
    max-width: 600px;
    width: 90%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #2d3148;
    gap: 10px;
  }
  #modal-title { font-size: 0.85rem; color: #a78bfa; font-family: monospace; word-break: break-all; }
  #modal-close {
    background: none; border: none; color: #94a3b8;
    font-size: 1.3rem; cursor: pointer; line-height:1;
    padding: 2px 6px; border-radius: 4px;
  }
  #modal-close:hover { background: #2d3148; }

  #modal-preview {
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    min-height: 200px;
  }
  #modal-preview img { max-width: 100%; max-height: 300px; object-fit: contain; }

  #modal-body { padding: 16px 18px; overflow-y: auto; }

  .modal-row { margin-bottom: 14px; }
  .modal-label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .modal-val {
    background: #12141f;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.78rem;
    font-family: monospace;
    color: #e2e8f0;
    word-break: break-all;
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
  }

  .modal-copy {
    margin-top: 6px;
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1px solid #2d3148;
    color: #94a3b8; padding: 5px 10px; border-radius: 7px;
    font-size: 0.76rem; cursor: pointer; transition: background .15s;
  }
  .modal-copy:hover { background: #2d3148; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #6d28d9; color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  .error-box {
    background: #2d1a1a; border: 1px solid #7f1d1d;
    border-radius: 10px; padding: 16px; margin: 20px 24px;
    color: #fca5a5; font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>
    Galería SVG
  </div>
  <span class="path-label">bahiar/bhi › assets/cuadros</span>
  <button id="btn-refresh" onclick="loadSVGs()">
    <svg id="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Actualizar
  </button>
</header>

<div id="status">Cargando SVGs...</div>
<div id="count"></div>
<div id="grid"></div>

<!-- Modal -->
<div id="modal-bg" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-preview"><img id="modal-img" src="" alt=""></div>
    <div id="modal-body">
      <div class="modal-row">
        <div class="modal-label">URL Raw</div>
        <div class="modal-val" id="m-url"></div>
        <button class="modal-copy" onclick="copyText('m-url')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar URL
        </button>
      </div>
      <div class="modal-row">
        <div class="modal-label">Código para compartir (img tag)</div>
        <div class="modal-val" id="m-code"></div>
        <button class="modal-copy" onclick="copyText('m-code')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar código
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const OWNER = 'bahiar', REPO = 'bhi', PATH = 'assets/cuadros';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
const RAW = (file) => `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${PATH}/${file}`;

function rawUrl(name) { return RAW(encodeURIComponent(name)); }
function imgTag(name) { return `<img src="${rawUrl(name)}" alt="${name}" />`; }

async function loadSVGs() {
  const btn = document.getElementById('btn-refresh');
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const count = document.getElementById('count');

  btn.classList.add('spinning');
  btn.disabled = true;
  status.textContent = 'Actualizando...';
  status.style.display = 'block';
  grid.innerHTML = '';
  count.textContent = '';

  try {
    const res = await fetch(API + '?t=' + Date.now());
    if (!res.ok) throw new Error(`GitHub API: ${res.status} ${res.statusText}`);
    const files = await res.json();

    const svgs = files.filter(f => f.name.toLowerCase().endsWith('.svg'));

    if (!svgs.length) {
      status.textContent = 'No se encontraron archivos SVG en esta carpeta.';
      return;
    }

    status.style.display = 'none';
    count.textContent = `${svgs.length} SVG${svgs.length !== 1 ? 's' : ''} encontrados`;

    svgs.forEach(f => {
      const url = rawUrl(f.name);
      const code = imgTag(f.name);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview">
          <img src="${url}" alt="${f.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2250%22 font-size=%2240%22>⚠️</text></svg>'">
        </div>
        <div class="info">
          <div class="filename">${f.name}</div>
          <div class="actions">
            <button class="btn btn-view" onclick='openModal(${JSON.stringify(f.name)})'>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Ver detalle
            </button>
            <button class="btn btn-url" onclick='copyStr(${JSON.stringify(url)}, this)'>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Copiar URL
            </button>
            <button class="btn btn-code" onclick='copyStr(${JSON.stringify(code)}, this)'>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              Copiar código
            </button>
          </div>
        </div>`;
      grid.appendChild(card);
    });

  } catch (e) {
    status.style.display = 'none';
    grid.innerHTML = `<div class="error-box">❌ <strong>Error al cargar los SVGs:</strong><br>${e.message}<br><br>Verificá que el repositorio y la ruta sean públicos.</div>`;
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

function openModal(name) {
  const url = rawUrl(name);
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-img').src = url;
  document.getElementById('m-url').textContent = url;
  document.getElementById('m-code').textContent = imgTag(name);
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg') || e.currentTarget.id === 'modal-close')
    document.getElementById('modal-bg').classList.remove('open');
}

function copyText(id) {
  copyStr(document.getElementById(id).textContent);
}

function copyStr(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('¡Copiado al portapapeles!');
    if (btn) {
      const orig = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = btn.innerHTML.replace(/Copiar.*/, '✓ Copiado');
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

loadSVGs();
</script>
</body>
</html>
