    <script defer>
      /**
       * Módulo de Imágenes — filtros y renderizado vía PillsEngine.
       * La configuración de qué pills se muestran vive en pills-config.js.
       *
       * SERVICIOS_MAP se usa solo para armar el string "SERVICIOS" que se
       * muestra en cada card (ej. "Rayos X, Ecografía"), listando TODOS los
       * estudios que ofrece el centro — es independiente de las opciones del
       * selector de filtro (que solo tiene 7). Por eso queda acá y no en
       * pills-config.js: no es un filtro, es una transformación de display.
       */
      const SERVICIOS_MAP = {
        RX: 'Rayos X',
        ECO: 'Ecografía',
        DMO: 'Densitometría',
        MAMO: 'Mamografía',
        DENT: 'Radiología Dental',
        PET: 'PET',
        GAMMA: 'Cámara Gamma',
        TAC: 'Tomografía (TAC)',
        RMN: 'Resonancia (RMN)',
        DOPPLER: 'Doppler'
      };

      document.addEventListener('DOMContentLoaded', () => {
        PillsEngine.init('imagenes', {
          transformItem: (item) => {
            const serviciosDisponibles = Object.keys(SERVICIOS_MAP)
              .filter(key => item[key] === true)
              .map(key => SERVICIOS_MAP[key])
              .join(', ');
            return { ...item, SERVICIOS: serviciosDisponibles };
          }
        });
      });
    </script>
