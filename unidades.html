  <script defer>
    let __unidadesSanitarias = [];

    function renderUnidadesSanitarias() {
      const contenedorUnidades = document.getElementById('contenedor-unidades-sanitarias');
      if (!contenedorUnidades || typeof window.crearCardHTML !== 'function') return;
      contenedorUnidades.innerHTML = __unidadesSanitarias
        .map((item, i) => window.crearCardHTML(item, 'UNIDAD_SANITARIA', i))
        .join('');
    }

    // Se llama desde el botón "Ordenar por cercanía". El pedido de permiso
    // de ubicación al navegador solo ocurre en este click, nunca al cargar la página.
    async function activarUbicacionUnidades(boton) {
      const span = boton ? boton.querySelector('span') : null;
      if (boton) {
        boton.disabled = true;
        if (span) span.textContent = 'Buscando ubicación…';
      }

      const posicion = typeof window.obtenerPosicionUsuario === 'function'
        ? await window.obtenerPosicionUsuario()
        : null;

      window.posicionUsuario = posicion;

      if (!posicion) {
        if (boton && span) {
          span.textContent = 'No pudimos acceder a tu ubicación';
          setTimeout(() => {
            boton.disabled = false;
            span.textContent = 'Ordenar por cercanía';
          }, 3000);
        }
        return;
      }

      if (typeof window.calcularDistanciaKm === 'function') {
        const distanciaDe = item => (Number.isFinite(item.lat) && Number.isFinite(item.lng))
          ? window.calcularDistanciaKm(posicion.lat, posicion.lng, item.lat, item.lng)
          : Infinity;
        __unidadesSanitarias = [...__unidadesSanitarias].sort((a, b) => distanciaDe(a) - distanciaDe(b));
      }

      renderUnidadesSanitarias();

      if (boton) {
        if (span) span.textContent = 'Más cerca';
        boton.hidden = true; // ya cumplió su función
      }
    }
    window.activarUbicacionUnidades = activarUbicacionUnidades;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contenedorUnidades = document.getElementById('contenedor-unidades-sanitarias');
        if (contenedorUnidades && typeof window.crearCardHTML === 'function') {
          fetch('data/bd_bahiar.json')
            .then(response => response.json())
            .then(data => {
              __unidadesSanitarias = data.prestadores.filter(item => item.TIPO === 'UNIDAD SANITARIA');
              renderUnidadesSanitarias();
            })
            .catch(err => {
              console.error('[BAHI.ar] Error al cargar unidades sanitarias:', err);
              contenedorUnidades.innerHTML = '<p style="text-align: center; color: #888; padding: 20px;">No se pudieron cargar las unidades sanitarias</p>';
            });
        }

      }, 150);
    });
  </script>
