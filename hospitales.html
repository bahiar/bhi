  <script defer>
    const SVG_WEB = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>';
    const SVG_TEL = '<svg class="card-field-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>';

    function normalizarTel(t) {
      if (!t) return '';
      return /^tel:/i.test(t) ? t : 'tel:' + t;
    }

    function crearCardHospital(h) {
      const fijoHref = normalizarTel(h.FIJO);
      const movilEsWsp = h.MOVIL && /^https:\/\//i.test(h.MOVIL);
      const movilHref = h.MOVIL ? (movilEsWsp ? h.MOVIL : normalizarTel(h.MOVIL)) : '';
      const mapsHref = window.safeMapsUrl(h.MAPS);

      const subnombres = Array.isArray(h.SUBNOMBRE) ? h.SUBNOMBRE.filter(Boolean) : [];

      const direccion = [h.DOMICILIO, h.LOCALIDAD, h.CP ? `CP ${window.esc(h.CP)}` : null].filter(Boolean).join(' · ');

      const telefonos = Array.isArray(h.TELEFONO) ? h.TELEFONO.filter(Boolean) : [];
      const otrosTelefonos = telefonos.filter((t) => normalizarTel(t) !== fijoHref);

      const acciones = [
        fijoHref ? `<a href="${window.escAttr(fijoHref)}" class="btn btn-accent" aria-label="Llamar a ${window.escAttr(h.PRESTADOR)}">${SVG_LLAMAR} Llamar</a>` : '',
        movilEsWsp ? `<a href="${window.escAttr(movilHref)}" class="btn btn-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp de ${window.escAttr(h.PRESTADOR)}">${SVG_WHATSAPP} WhatsApp</a>` : (movilHref && !fijoHref ? `<a href="${window.escAttr(movilHref)}" class="btn btn-accent" aria-label="Llamar a ${window.escAttr(h.PRESTADOR)}">${SVG_LLAMAR} Llamar</a>` : ''),
        mapsHref ? `<a href="${window.escAttr(mapsHref)}" class="btn btn-outline" target="_blank" rel="noopener noreferrer" aria-label="Ver mapa de ${window.escAttr(h.PRESTADOR)}">${SVG_MAPA} Mapa</a>` : '',
        h.URL ? `<a href="${window.escAttr(h.URL)}" class="btn btn-outline" target="_blank" rel="noopener noreferrer" aria-label="Sitio web de ${window.escAttr(h.PRESTADOR)}">${SVG_WEB} Sitio web</a>` : '',
      ].filter(Boolean).join('');

      const detalle = otrosTelefonos.length
        ? `<p class="card-detail-row">${SVG_TEL}<strong>Otros teléfonos:</strong> ${otrosTelefonos.map((t) => `<a href="${window.escAttr(normalizarTel(t))}">${window.esc(t.replace(/^tel:/i, ''))}</a>`).join(', ')}</p>`
        : '';

      return `
<article class="card" data-estado="" data-tipo="${window.escAttr(h.TIPO || '')}"
    data-domicilio="${window.escAttr(h.DOMICILIO || '')}" data-localidad="${window.escAttr(h.LOCALIDAD || '')}"
    data-fijo="${window.escAttr(h.FIJO || '')}" data-movil="${window.escAttr(h.MOVIL || '')}"
    data-subnombre="${window.escAttr(subnombres.join(' | '))}">
    <div class="card-top">
        <div class="card-info">
            <h3 class="card-name">${window.esc(h.PRESTADOR)}</h3>
            ${direccion ? `<p class="card-addr">${window.esc(direccion)}</p>` : ''}
        </div>
    </div>
    ${acciones ? `<div class="card-actions">${acciones}</div>` : ''}
    ${detalle ? `<div class="card-body-collapse open">${detalle}</div>` : ''}
</article>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contenedor = document.getElementById('contenedor-cards');
        if (!contenedor) return;

        fetch('data/hospitales.json', { cache: 'no-cache' })
          .then((res) => {
            if (!res.ok) throw new Error('No se pudo cargar data/hospitales.json');
            return res.json();
          })
          .then((data) => {
            const hospitales = (data && data.hospitales) || [];
            if (!hospitales.length) throw new Error('Sin datos de hospitales');
            contenedor.innerHTML = hospitales.map(crearCardHospital).join('');
          })
          .catch((err) => {
            console.error('Error cargando hospitales:', err);
            contenedor.innerHTML = '<p class="sin-resultados">No se pudo cargar la información de hospitales. Intentá nuevamente más tarde.</p>';
          });
      }, 150);
    });
  </script>

  <script>

      var item=btn.closest('.faq-i');
      var isOpen=item.classList.contains('open');
      document.querySelectorAll('.faq-i.open').forEach(function(i){i.classList.remove('open');});
      if(!isOpen) item.classList.add('open');
    }
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'){
        var o=document.getElementById('faq-modal-overlay');if(o)o.style.display='none';

          var t=document.querySelector('.bottom-nav-item[aria-controls=mas-modal-overlay]');
