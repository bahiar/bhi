    <style>
        /* ── Layout general ── */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* el mapa ocupa toda la pantalla disponible */
        }

        /* El header de BAHI.ar tiene position:sticky; acá lo dejamos estático
           para que el mapa ocupe el resto del viewport */
        .main-header {
            position: relative !important;
            z-index: 400;
        }

        /* Ocultar buscador global y barra secundaria — no aplican en esta página */
        .search-container--hero,
        .busqueda-global-resultados,
        .search-bar-below,
        .sub-nav {
            display: none !important;
        }

        /* ── Contenedor del mapa ── */
        #mapa-wrapper {
            position: relative;
            /* Altura = 100vh menos header (~64px) menos bottom-nav (~64px) */
            height: calc(100dvh - 64px - 64px);
        }

        #mapa {
            width: 100%;
            height: 100%;
        }

        /* Oscurece un poco los tiles de Positron (gris más marcado) */
        #mapa .leaflet-tile-pane {
            filter: brightness(0.82) contrast(1.05) saturate(0.9);
        }

        /* ── Panel de filtros (sobre el mapa) ── */
        #filtros-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: var(--bg-card, #fff);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: calc(100vw - 24px);
            width: max-content;
        }

        .filtro-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 5px 11px 5px 8px;
            transition: opacity 0.15s, border-color 0.15s;
            user-select: none;
            line-height: 1;
        }

        .filtro-chip input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 2px solid currentColor;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: background 0.15s;
        }

        .filtro-chip input[type="checkbox"]:checked {
            background: currentColor;
        }

        .filtro-chip input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 2px;
            top: -1px;
            width: 6px;
            height: 9px;
            border: 2px solid #fff;
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        .filtro-chip--farmacias  { color: #1565C0; background: #e8f0fe; border-color: #1565C0; }
        .filtro-chip--laboratorios { color: #2E7D32; background: #e8f5e9; border-color: #2E7D32; }
        .filtro-chip--hospitales { color: #C62828; background: #fce8e8; border-color: #C62828; }
        .filtro-chip--sanitarias { color: #E65100; background: #fff3e0; border-color: #E65100; }

        .filtro-chip.inactivo {
            opacity: 0.4;
            border-color: #ccc;
            background: #f5f5f5;
        }

        #btn-recargar-mapa {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 20px;
            padding: 5px 12px 5px 9px;
            border: 2px solid #757575;
            background: #eeeeee;
            color: #424242;
            cursor: pointer;
            line-height: 1;
            transition: background 0.15s;
        }

        #btn-recargar-mapa:active { background: #d8d8d8; }
        #btn-recargar-mapa svg { transition: transform 0.4s; flex-shrink: 0; }
        #btn-recargar-mapa:active svg { transform: rotate(180deg); }

        /* ── Botón "Mi ubicación" (dentro del panel de filtros) ── */
        #btn-ubicacion {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 20px;
            padding: 5px 12px 5px 9px;
            border: 2px solid #1565C0;
            background: #e8f0fe;
            color: #1565C0;
            cursor: pointer;
            line-height: 1;
            transition: background 0.15s;
        }

        #btn-ubicacion:active { background: #d5e4fb; }
        #btn-ubicacion svg { flex-shrink: 0; }

        /* ── Toast de estado ── */
        #mapa-toast {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: rgba(25,25,113,0.9);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        #mapa-toast.visible { opacity: 1; }

        /* ── Popup de Leaflet — ajuste de fuente ── */
        .leaflet-popup-content {
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
            margin: 10px 14px;
        }

        .leaflet-popup-content strong {
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .popup-tipo {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-radius: 10px;
            padding: 2px 7px;
            margin-bottom: 4px;
        }

        .popup-tipo--FARMACIA    { background:#e8f0fe; color:#1565C0; }
        .popup-tipo--LABORATORIO { background:#e8f5e9; color:#2E7D32; }
        .popup-tipo--HOSPITAL    { background:#fce8e8; color:#C62828; }
        .popup-tipo--SANITARIA   { background:#fff3e0; color:#E65100; }

        .popup-dir { color: #555; font-size: 12px; margin-top: 2px; }

        /* ── Sin datos ── */
        #mapa-sin-datos {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: rgba(25,25,113,0.88);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
            text-align: center;
        }

        #mapa-sin-datos svg { display: none; }
        #mapa-sin-datos p { margin: 0; font-weight: 600; color: #fff; display: inline; }
        #mapa-sin-datos span { display: none; }

        /* ── Marcador de ubicación del usuario ── */
        .user-location-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1565C0;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px #1565C0, 0 2px 8px rgba(0,0,0,0.35);
            position: relative;
        }

        .user-location-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            background: rgba(21,101,192,0.4);
            animation: pulso-ubicacion 1.8s ease-out infinite;
        }

        @keyframes pulso-ubicacion {
            0%   { transform: scale(1);   opacity: 0.7; }
            100% { transform: scale(2.8); opacity: 0; }
        }
    </style>

    <script>
    (function () {
        'use strict';

        // ── Colores por tipo ──────────────────────────────────────────────
        const COLORES = {
            FARMACIA:    '#1565C0',
            LABORATORIO: '#2E7D32',
            HOSPITAL:    '#C62828',
            GUARDIA:     '#C62828',
            CLINICA:     '#C62828',
            SANITARIA:   '#E65100',
        };

        // Normaliza el tipo del JSON al tipo de filtro
        function tipoFiltro(tipo) {
            if (!tipo) return null;
            const t = tipo.toUpperCase();
            if (t === 'FARMACIA')    return 'FARMACIA';
            if (t === 'LABORATORIO') return 'LABORATORIO';
            if (t === 'HOSPITAL' || t === 'GUARDIA' || t === 'CLINICA') return 'HOSPITAL';
            if (t === 'SANITARIA' || t === 'UNIDAD SANITARIA') return 'SANITARIA';
            return null;
        }

        // ── Icono SVG de pin personalizado ───────────────────────────────
        function crearIcono(tipo) {
            const color = COLORES[tipo] || '#191971';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
                <path d="M14 0C6.268 0 0 6.268 0 14c0 9.333 14 22 14 22S28 23.333 28 14C28 6.268 21.732 0 14 0z"
                      fill="${color}" stroke="#fff" stroke-width="1.5"/>
                <circle cx="14" cy="14" r="5" fill="#fff"/>
            </svg>`;
            return L.divIcon({
                html: svg,
                className: '',
                iconSize: [28, 36],
                iconAnchor: [14, 36],
                popupAnchor: [0, -38],
            });
        }

        // ── Inicializar mapa ──────────────────────────────────────────────
        const mapa = L.map('mapa', {
            center: [-38.7183, -62.2661], // Bahía Blanca
            zoom: 13,
            zoomControl: true,
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
            maxZoom: 19,
            subdomains: 'abcd',
        }).addTo(mapa);

        // Mover los controles de zoom a la derecha para no chocar con el panel
        mapa.zoomControl.setPosition('bottomright');

        // ── Estado ───────────────────────────────────────────────────────
        let todosLosMarcadores = []; // [{ marker, tipo }]
        let filtrosActivos = new Set();

        // ── Cargar BD ─────────────────────────────────────────────────────
        // IMPORTANTE: la BD necesita coordenadas lat/lng en cada prestador.
        // Formato esperado en bd_bahiar.json:
        //   { "ID": "FAR-001", "NOMBRE": "...", "TIPO": "FARMACIA",
        //     "DOMICILIO": "...", "lat": -38.71, "lng": -62.27, ... }
        //
        // Los prestadores sin lat/lng se ignoran en el mapa (no se plotean).

        // ── Geocodificación con Nominatim desde el browser ──────────────
        // Caché en sessionStorage para no repetir requests en la misma sesión.
        const GEO_CACHE_KEY = 'bahiar_geo_cache';

        function getCacheGeo() {
            try { return JSON.parse(sessionStorage.getItem(GEO_CACHE_KEY) || '{}'); }
            catch { return {}; }
        }

        function setCacheGeo(cache) {
            try { sessionStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); }
            catch {}
        }

        async function geocodificar(domicilio, localidad) {
            const key = `${domicilio}|${localidad}`;
            const cache = getCacheGeo();
            if (cache[key]) return cache[key];

            const q = encodeURIComponent(`${domicilio}, ${localidad}, Buenos Aires, Argentina`);
            const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=ar`;

            try {
                const r = await fetch(url, { headers: { 'Accept-Language': 'es' } });
                const data = await r.json();
                if (data.length > 0) {
                    const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    cache[key] = coords;
                    setCacheGeo(cache);
                    return coords;
                }
            } catch {}
            return null;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function cargarPrestadores() {
            let bd;
            try {
                const r = await fetch('data/bd_bahiar.json');
                bd = await r.json();
            } catch {
                mostrarToast('No se pudo cargar la base de datos', 5000);
                return;
            }

            const prestadores = Array.isArray(bd) ? bd : (bd.prestadores || []);
            const total = prestadores.length;
            let procesados = 0, geocodificados = 0, fallidos = 0;

            mostrarToast(`Cargando ${total} prestadores…`, 60000);

            for (const p of prestadores) {
                const tipo = tipoFiltro(p.TIPO);
                if (!tipo) { procesados++; continue; }

                let lat = p.lat, lng = p.lng;

                // Si no tiene coords, geocodificar
                if (!lat || !lng) {
                    const coords = await geocodificar(p.DOMICILIO || '', p.LOCALIDAD || 'Bahia Blanca');
                    if (coords) { lat = coords.lat; lng = coords.lng; geocodificados++; }
                    else { fallidos++; procesados++; continue; }
                    await sleep(1100); // respetar rate limit de Nominatim
                }

                const marker = L.marker([lat, lng], { icon: crearIcono(p.TIPO?.toUpperCase() || tipo) });
                const nombre = p.PRESTADOR || p.NOMBRE || p.nombre || '—';
                const domicilio = p.DOMICILIO || '';
                const tipoLabel = p.TIPO || tipo;

                marker.bindPopup(`
                    <span class="popup-tipo popup-tipo--${tipo}">${tipoLabel}</span>
                    <strong>${nombre}</strong>
                    ${domicilio ? `<div class="popup-dir">📍 ${domicilio}</div>` : ''}
                `);

                todosLosMarcadores.push({ marker, tipo });
                procesados++;

                // Ir mostrando marcadores a medida que se geocodifican
                aplicarFiltros();

                // Actualizar toast cada 10 registros
                if (procesados % 10 === 0) {
                    mostrarToast(`Cargando… ${procesados}/${total}`, 60000);
                }
            }

            aplicarFiltros();

            const msg = fallidos > 0
                ? `${todosLosMarcadores.length} prestadores cargados · ${fallidos} sin ubicación`
                : `${todosLosMarcadores.length} prestadores cargados`;
            mostrarToast(msg, 4000);
        }

        cargarPrestadores();

        // ── Hospitales hardcodeados (no están en bd_bahiar.json) ─────────
        const HOSPITALES = [
            { PRESTADOR: "Hospital Municipal Dr. Leónidas Lucero", DOMICILIO: "Estomba 968",      FIJO: "02914598484", lat: -38.71026, lng: -62.27716 },
            { PRESTADOR: "Hospital Interzonal Dr. José Penna",      DOMICILIO: "Av. Lainez 2401",  FIJO: "02914593600", lat: -38.72969, lng: -62.22772 },
            { PRESTADOR: "Hospital Privado del Sur",                 DOMICILIO: "Las Heras 164",    FIJO: "02914550270", lat: -38.71889, lng: -62.26098 },
            { PRESTADOR: "Hospital de la Asociación Médica",        DOMICILIO: "Patricios 347",    FIJO: "02914557877", lat: -38.71727, lng: -62.27837 },
            { PRESTADOR: "Hospital Italiano Regional del Sur",      DOMICILIO: "Necochea 675",     FIJO: "02914583100", lat: -38.73310, lng: -62.23409 },
            { PRESTADOR: "Hospital Regional Español",               DOMICILIO: "Estomba 571",      FIJO: "02914595555", lat: -38.71342, lng: -62.27237 },
            { PRESTADOR: "Hospital Dr. Raúl Matera",               DOMICILIO: "9 de Julio 461",   FIJO: "02914558880", lat: -38.72133, lng: -62.27999 },
            { PRESTADOR: "Hospital Militar",                         DOMICILIO: "Florida 1450",     FIJO: "",            lat: -38.68880, lng: -62.26504 },
        ];

        HOSPITALES.forEach(h => {
            const marker = L.marker([h.lat, h.lng], { icon: crearIcono('HOSPITAL') });
            marker.bindPopup(`
                <span class="popup-tipo popup-tipo--HOSPITAL">HOSPITAL</span>
                <strong>${h.PRESTADOR}</strong>
                <div class="popup-dir">📍 ${h.DOMICILIO}</div>
                <div class="popup-dir">📞 ${h.FIJO}</div>
            `);
            todosLosMarcadores.push({ marker, tipo: 'HOSPITAL' });
        });

        aplicarFiltros();


        // ── Aplicar filtros ───────────────────────────────────────────────
        function aplicarFiltros() {
            let visibles = 0;

            todosLosMarcadores.forEach(({ marker, tipo }) => {
                if (filtrosActivos.has(tipo)) {
                    marker.addTo(mapa);
                    visibles++;
                } else {
                    marker.remove();
                }
            });

            document.getElementById('mapa-sin-datos').hidden = visibles > 0 || todosLosMarcadores.length === 0;
        }

        // ── Checkboxes ────────────────────────────────────────────────────
        document.querySelectorAll('#filtros-panel input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function () {
                const tipo = this.dataset.tipo;
                if (this.checked) {
                    filtrosActivos.add(tipo);
                } else {
                    filtrosActivos.delete(tipo);
                }
                // Actualizar apariencia del chip
                this.closest('.filtro-chip').classList.toggle('inactivo', !this.checked);
                aplicarFiltros();
            });
        });

        // ── Recargar mapa ────────────────────────────────────────────────
        document.getElementById('btn-recargar-mapa').addEventListener('click', function () {
            location.reload();
        });

        // ── Mi ubicación ─────────────────────────────────────────────────
        document.getElementById('btn-ubicacion').addEventListener('click', function () {
            if (!navigator.geolocation) {
                mostrarToast('Geolocalización no disponible', 3000);
                return;
            }
            mostrarToast('Buscando tu ubicación…', 3000);
            navigator.geolocation.getCurrentPosition(
                pos => {
                    try {
                        const { latitude: lat, longitude: lng, accuracy } = pos.coords;

                        // Limpiar marcador y círculo de precisión anteriores
                        if (window._marcadorUsuario) window._marcadorUsuario.remove();
                        if (window._circuloPrecisionUsuario) window._circuloPrecisionUsuario.remove();

                        // Círculo de precisión (radio real del GPS, en metros)
                        window._circuloPrecisionUsuario = L.circle([lat, lng], {
                            radius: accuracy || 30,
                            color: '#1565C0',
                            weight: 3,
                            fillColor: '#1565C0',
                            fillOpacity: 0.15,
                        }).addTo(mapa);

                        // Encuadrar el mapa al tamaño real del círculo (chico o grande)
                        mapa.fitBounds(window._circuloPrecisionUsuario.getBounds(), { maxZoom: 18, padding: [40, 40] });

                        // Punto de ubicación con animación de pulso
                        window._marcadorUsuario = L.marker([lat, lng], {
                            icon: L.divIcon({
                                html: '<div class="user-location-dot"></div>',
                                className: '',
                                iconSize: [18, 18],
                                iconAnchor: [9, 9],
                            }),
                            zIndexOffset: 1000,
                        }).addTo(mapa).bindPopup('Tu ubicación').openPopup();

                        // DIAGNÓSTICO TEMPORAL — sacar esta línea una vez resuelto
                        mostrarToast('Precisión: ' + Math.round(accuracy || 0) + ' m — círculo OK', 5000);
                    } catch (err) {
                        // DIAGNÓSTICO TEMPORAL — sacar este catch una vez resuelto
                        mostrarToast('Error JS: ' + err.message, 6000);
                    }
                },
                () => mostrarToast('No se pudo obtener la ubicación', 3000)
            );
        });

        // ── Toast helper ─────────────────────────────────────────────────
        function mostrarToast(msg, duracion) {
            const t = document.getElementById('mapa-toast');
            t.textContent = msg;
            t.classList.add('visible');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('visible'), duracion || 3000);
        }

    })();
    </script>

</body>
</html>
